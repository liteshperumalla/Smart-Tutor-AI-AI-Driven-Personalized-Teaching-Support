# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# CodeRabbit Configuration
# https://docs.coderabbit.ai/

reviews:
  profile: "chill"
  request_changes_workflow: true
  high_level_summary: true
  auto_title_placeholder: true
  review_status: true
  poem: false
  collapse_walkthrough: false
  sequence_diagrams: true

  # What to review
  show_variable_types: true
  show_constants: true
  show_function_arguments: true
  show_timing: true

# Categories of checks
categories:
  security:
    enabled: true
  performance:
    enabled: true
  best_practices:
    enabled: true
  bugs:
    enabled: true
  style:
    enabled: true
  documentation:
    enabled: true
  test_coverage:
    enabled: true

# Path filters
path_filters:
  python:
    - "backend/**"
  typescript:
    - "frontend/**"

# Ignore certain files/directories
ignore:
  - "**/node_modules/**"
  - "**/venv/**"
  - "**/.git/**"
  - "**/__pycache__/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/*.min.js"
  - "**/*.min.css"
