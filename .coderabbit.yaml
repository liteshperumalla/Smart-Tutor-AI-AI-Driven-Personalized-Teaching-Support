# CodeRabbit Configuration File
# https://docs.coderabbit.ai/

version: "2"

engines:
  reviews:
    path: .coderabbit/coderabbit_reviews.yaml

# Configuration for Python (backend)
languages:
  python:
    path_filters:
      - "backend/**"
    review_status: true
    allow_comments: true
    high_level_summary: true
    auto_title-placeholder: "[Python]"
    collapsewalkthrough: false

  typescript:
    path_filters:
      - "frontend/**"
    review_status: true
    allow_comments: true
    high_level_summary: true
    auto_title-placeholder: "[TypeScript]"
    collapsewalkthrough: false

# Code review settings
reviews:
  profile: "chill"  # balanced between thoroughness and speed
  request_changes_workflow: true
  high_level_summary: true
  auto_title-placeholder: true
  review_status: true
  poem: false
  collapse_walkthrough: false
  sequence_diagrams: true

# What to review
review:
  show_variable_types: true
  show_constants: true
  show_function_arguments: true
  show_timing: true

# AI-specific settings
chat:
  auto_reply: true

# Categories of checks
categories:
  security:
    enabled: true
  performance:
    enabled: true
  best_practices:
    enabled: true
  bugs:
    enabled: true
  style:
    enabled: true
  documentation:
    enabled: true
  test_coverage:
    enabled: true

# Ignore certain files/directories
ignore:
  - "**/node_modules/**"
  - "**/venv/**"
  - "**/.git/**"
  - "**/__pycache__/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/*.min.js"
  - "**/*.min.css"
