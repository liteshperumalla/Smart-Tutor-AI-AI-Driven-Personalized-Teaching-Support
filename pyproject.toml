[tool.poetry]
name = "smart-ai-tutor"
version = "1.0.0"
description = "AI-Driven Personalized Teaching Support"
authors = ["Litesh Perumalla <litesh@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.test.dependencies]
pytest = "^8.3"
httpx = "^0.28"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# =============================================================================
# mypy — Static type checking
# =============================================================================
[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "venv/",
    "node_modules/",
    "_archive/",
    "_legacy/",
    "backend/alembic/",
    "frontend/",
]

[[tool.mypy.overrides]]
module = "backend.utils"
ignore_errors = true

[[tool.mypy.overrides]]
module = "utils"
ignore_errors = true

# =============================================================================
# Bandit — Python security linting
# =============================================================================
[tool.bandit]
exclude_dirs = ["venv", "node_modules", "_archive", "_legacy", "backend/tests"]
skips = [
    "B101",
    "B601",
]
severity = "MEDIUM"
confidence = "MEDIUM"

# =============================================================================
# Ruff — Fast Python linter (replaces flake8 + isort + pyupgrade)
# =============================================================================
[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "S",
    "C4",
]
ignore = [
    "E501",
    "S101",
    "S104",
    "B008",
]
exclude = ["venv/", "_archive/", "_legacy/", "frontend/"]

[tool.ruff.per-file-ignores]
"backend/tests/**" = ["S", "E501"]

# =============================================================================
# pytest — Test configuration
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -q"
