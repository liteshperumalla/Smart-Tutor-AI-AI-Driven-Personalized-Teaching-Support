{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smart-ai-tutor.fullname" . }}-frontend
  labels:
    {{- include "smart-ai-tutor.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  {{- if not .Values.frontend.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: {{ .Values.frontend.strategy.maxSurge | default 1 }}
  selector:
    matchLabels:
      {{- include "smart-ai-tutor.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/frontend/configmap.yaml") . | sha256sum }}
        {{- with .Values.frontend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "smart-ai-tutor.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
        version: {{ .Values.frontend.image.tag | default .Chart.AppVersion }}
    spec:
      {{- include "smart-ai-tutor.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "smart-ai-tutor.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.frontend.podSecurityContext | nindent 8 }}
      containers:
        - name: frontend
          securityContext:
            {{- toYaml .Values.frontend.securityContext | nindent 12 }}
          image: {{ include "smart-ai-tutor.frontend.image" . | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy | default .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: {{ .Values.environment | default .Values.global.environment | quote }}
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.frontend.apiUrl | quote }}
            - name: NEXT_PUBLIC_ENVIRONMENT
              value: {{ .Values.environment | default .Values.global.environment | quote }}
            {{- if .Values.frontend.extraEnv }}
            {{- toYaml .Values.frontend.extraEnv | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "smart-ai-tutor.fullname" . }}-frontend
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.frontend.livenessProbe.initialDelaySeconds | default 30 }}
            periodSeconds: {{ .Values.frontend.livenessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.frontend.livenessProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.frontend.livenessProbe.failureThreshold | default 3 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.frontend.readinessProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.frontend.readinessProbe.periodSeconds | default 5 }}
            timeoutSeconds: {{ .Values.frontend.readinessProbe.timeoutSeconds | default 3 }}
            failureThreshold: {{ .Values.frontend.readinessProbe.failureThreshold | default 3 }}
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.frontend.startupProbe.initialDelaySeconds | default 0 }}
            periodSeconds: {{ .Values.frontend.startupProbe.periodSeconds | default 5 }}
            timeoutSeconds: {{ .Values.frontend.startupProbe.timeoutSeconds | default 3 }}
            failureThreshold: {{ .Values.frontend.startupProbe.failureThreshold | default 30 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nextjs-cache
              mountPath: /.next/cache
            {{- if .Values.frontend.volumeMounts }}
            {{- toYaml .Values.frontend.volumeMounts | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nextjs-cache
          emptyDir: {}
        {{- if .Values.frontend.volumes }}
        {{- toYaml .Values.frontend.volumes | nindent 8 }}
        {{- end }}
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
