{{- if and .Values.backend.enabled (dig "externalSecrets" "enabled" false .Values.secrets) }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "smart-ai-tutor.backendSecretName" . }}
  labels:
    {{- include "smart-ai-tutor.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecrets.secretStoreRef.name | required ".Values.secrets.externalSecrets.secretStoreRef.name is required when external secrets are enabled" }}
    kind: {{ .Values.secrets.externalSecrets.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ include "smart-ai-tutor.backendSecretName" . }}
    creationPolicy: Owner
  data:
    {{- range .Values.secrets.externalSecrets.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey | quote }}
        {{- if .property }}
        property: {{ .property | quote }}
        {{- end }}
        {{- if .version }}
        version: {{ .version | quote }}
        {{- end }}
    {{- end }}
{{- end }}
