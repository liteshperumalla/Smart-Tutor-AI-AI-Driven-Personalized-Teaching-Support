{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "smart-ai-tutor.fullname" . }}-{{ .Values.backend.name | default "backend" }}
  labels:
    {{- include "smart-ai-tutor.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- with .Values.backend.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.backend.service.type }}
  {{- if and (eq .Values.backend.service.type "ClusterIP") .Values.backend.service.clusterIP }}
  clusterIP: {{ .Values.backend.service.clusterIP }}
  {{- end }}
  {{- if and (eq .Values.backend.service.type "LoadBalancer") .Values.backend.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.backend.service.loadBalancerIP }}
  {{- end }}
  {{- if and (eq .Values.backend.service.type "LoadBalancer") .Values.backend.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml .Values.backend.service.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (or (eq .Values.backend.service.type "NodePort") (eq .Values.backend.service.type "LoadBalancer")) .Values.backend.service.nodePort }}
      nodePort: {{ .Values.backend.service.nodePort }}
      {{- end }}
  selector:
    {{- include "smart-ai-tutor.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  sessionAffinity: {{ .Values.backend.service.sessionAffinity | default "None" }}
  {{- if .Values.backend.service.sessionAffinityConfig }}
  sessionAffinityConfig:
    {{- toYaml .Values.backend.service.sessionAffinityConfig | nindent 4 }}
  {{- end }}
{{- end }}
