{{- if and .Values.backend.enabled (not (dig "externalSecrets" "enabled" false .Values.secrets)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smart-ai-tutor.backendSecretName" . }}
  labels:
    {{- include "smart-ai-tutor.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  # Database Credentials
  postgres-password: {{ .Values.postgresql.password | default "" | quote }}

  # Redis Credentials
  {{- if .Values.redis.password }}
  redis-password: {{ .Values.redis.password | quote }}
  {{- end }}

  # JWT Secret
  jwt-secret-key: {{ .Values.backend.jwtSecretKey | default "" | quote }}

  # AWS Credentials (if not using IAM roles)
  {{- if .Values.aws.accessKeyId }}
  aws-access-key-id: {{ .Values.aws.accessKeyId | quote }}
  aws-secret-access-key: {{ .Values.aws.secretAccessKey | required ".Values.aws.secretAccessKey is required when aws.accessKeyId is set!" | quote }}
  {{- end }}

  # Google OAuth (if enabled)
  {{- if .Values.backend.oauth.google.enabled }}
  google-client-id: {{ .Values.backend.oauth.google.clientId | required ".Values.backend.oauth.google.clientId is required!" | quote }}
  google-client-secret: {{ .Values.backend.oauth.google.clientSecret | required ".Values.backend.oauth.google.clientSecret is required!" | quote }}
  {{- end }}

  # SerpAPI (if enabled)
  {{- if .Values.backend.serpapi.enabled }}
  serpapi-key: {{ .Values.backend.serpapi.apiKey | required ".Values.backend.serpapi.apiKey is required!" | quote }}
  {{- end }}

  # Langfuse (if enabled)
  {{- if .Values.backend.monitoring.langfuse.enabled }}
  langfuse-secret-key: {{ .Values.backend.monitoring.langfuse.secretKey | required ".Values.backend.monitoring.langfuse.secretKey is required!" | quote }}
  {{- end }}

  # SMTP Credentials (for password reset)
  {{- if .Values.backend.smtp.enabled }}
  smtp-username: {{ .Values.backend.smtp.username | quote }}
  smtp-password: {{ .Values.backend.smtp.password | quote }}
  {{- end }}

  {{- if .Values.backend.extraSecrets }}
  {{- toYaml .Values.backend.extraSecrets | nindent 2 }}
  {{- end }}
{{- end }}
