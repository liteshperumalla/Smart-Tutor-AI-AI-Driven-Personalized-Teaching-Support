# Pre-commit hooks to prevent security issues
# Install with: pip install pre-commit && pre-commit install

repos:
  # Prevent committing secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json

  # Security linting
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: ['-c', 'pyproject.toml']
        additional_dependencies: ['bandit[toml]']

  # Static type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: ['--config-file', 'pyproject.toml', '--ignore-missing-imports']
        additional_dependencies:
          - 'types-requests'
          - 'types-redis'
          - 'pydantic>=2.0'
        files: '^backend/'
        exclude: '^(venv|_archive|_legacy|backend/alembic)/'

  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.11

  # Python import sorting
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort

  # YAML validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']

  # Environment file checks
  - repo: local
    hooks:
      - id: check-env-secrets
        name: Check .env for secrets
        entry: bash -c 'if grep -qE "(AWS_ACCESS_KEY_ID=AKIA|AWS_SECRET_ACCESS_KEY=[A-Za-z0-9+/]{40}|password=[A-Za-z0-9]{8,})" .env 2>/dev/null; then echo "ERROR: Found secrets in .env file!"; exit 1; fi'
        language: system
        files: '^\.env$'
        pass_filenames: false

      - id: security-verification
        name: Run security verification (production only)
        entry: bash -c 'if [ "$ENVIRONMENT" = "production" ]; then python scripts/verify_security.py || exit 1; fi'
        language: system
        pass_filenames: false
        stages: [push]

      - id: env-contract-drift
        name: Check environment contract drift
        entry: python scripts/check-env-drift.py
        language: system
        files: '(^|/)\.env(\.(example|local(\.example)?|prod|production))?$|(^|/)frontend/\.env(\.local(\.example)?)?$'
        pass_filenames: false
