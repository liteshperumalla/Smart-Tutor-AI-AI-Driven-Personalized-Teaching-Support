# Jaeger All-in-One Deployment
# For production, use Jaeger Operator or separate components

apiVersion: v1
kind: ServiceAccount
metadata:
  name: jaeger
  namespace: monitoring

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app: jaeger
    component: all-in-one
spec:
  replicas: 1  # Use Jaeger Operator for HA
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jaeger
      component: all-in-one
  template:
    metadata:
      labels:
        app: jaeger
        component: all-in-one
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "14269"
    spec:
      serviceAccountName: jaeger
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.52
          imagePullPolicy: IfNotPresent
          ports:
            # Agent
            - name: agent-compact
              containerPort: 6831
              protocol: UDP
            - name: agent-binary
              containerPort: 6832
              protocol: UDP
            - name: agent-http
              containerPort: 5778
              protocol: TCP
            # Collector
            - name: col-grpc
              containerPort: 14250
              protocol: TCP
            - name: col-http
              containerPort: 14268
              protocol: TCP
            - name: col-otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: col-otlp-http
              containerPort: 4318
              protocol: TCP
            - name: col-zipkin
              containerPort: 9411
              protocol: TCP
            # Query
            - name: query
              containerPort: 16686
              protocol: TCP
            - name: query-grpc
              containerPort: 16685
              protocol: TCP
            # Admin
            - name: admin
              containerPort: 14269
              protocol: TCP
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: COLLECTOR_ZIPKIN_HOST_PORT
              value: ":9411"
            - name: SPAN_STORAGE_TYPE
              value: "badger"
            - name: BADGER_EPHEMERAL
              value: "false"
            - name: BADGER_DIRECTORY_VALUE
              value: "/badger/data"
            - name: BADGER_DIRECTORY_KEY
              value: "/badger/key"
            - name: QUERY_BASE_PATH
              value: "/jaeger"
            # Memory limits
            - name: MEMORY_MAX_TRACES
              value: "50000"
            # Sampling
            - name: SAMPLING_STRATEGIES_FILE
              value: "/etc/jaeger/sampling_strategies.json"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /
              port: 14269
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 14269
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: badger-data
              mountPath: /badger
            - name: sampling-config
              mountPath: /etc/jaeger
              readOnly: true
      volumes:
        - name: badger-data
          persistentVolumeClaim:
            claimName: jaeger-badger-pvc
        - name: sampling-config
          configMap:
            name: jaeger-sampling-config

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jaeger-badger-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: gp3  # AWS EBS gp3

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-sampling-config
  namespace: monitoring
data:
  sampling_strategies.json: |
    {
      "default_strategy": {
        "type": "probabilistic",
        "param": 0.1
      },
      "service_strategies": [
        {
          "service": "backend-api",
          "type": "probabilistic",
          "param": 1.0
        },
        {
          "service": "frontend",
          "type": "probabilistic",
          "param": 0.5
        }
      ]
    }

---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: monitoring
  labels:
    app: jaeger
    component: collector
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 14250
      targetPort: 14250
      protocol: TCP
    - name: http
      port: 14268
      targetPort: 14268
      protocol: TCP
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: zipkin
      port: 9411
      targetPort: 9411
      protocol: TCP
  selector:
    app: jaeger
    component: all-in-one

---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: monitoring
  labels:
    app: jaeger
    component: query
spec:
  type: ClusterIP
  ports:
    - name: query
      port: 16686
      targetPort: 16686
      protocol: TCP
    - name: grpc
      port: 16685
      targetPort: 16685
      protocol: TCP
  selector:
    app: jaeger
    component: all-in-one

---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-agent
  namespace: monitoring
  labels:
    app: jaeger
    component: agent
spec:
  type: ClusterIP
  clusterIP: None  # Headless service
  ports:
    - name: compact
      port: 6831
      targetPort: 6831
      protocol: UDP
    - name: binary
      port: 6832
      targetPort: 6832
      protocol: UDP
    - name: http
      port: 5778
      targetPort: 5778
      protocol: TCP
  selector:
    app: jaeger
    component: all-in-one

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger-query
  namespace: monitoring
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/healthcheck-path: /
    # OAuth or basic auth recommended
    alb.ingress.kubernetes.io/auth-type: cognito
spec:
  rules:
    - host: jaeger.internal.your-domain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jaeger-query
                port:
                  number: 16686
