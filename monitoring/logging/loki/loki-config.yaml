apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info

    # Common configuration
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    # Distributor
    distributor:
      ring:
        kvstore:
          store: inmemory

    # Ingester configuration
    ingester:
      lifecycler:
        address: 127.0.0.1
        ring:
          kvstore:
            store: inmemory
          replication_factor: 1
        final_sleep: 0s
      chunk_idle_period: 5m
      chunk_retain_period: 30s
      max_chunk_age: 1h
      chunk_target_size: 1048576
      chunk_encoding: snappy
      wal:
        enabled: true
        dir: /loki/wal

    # Schema configuration
    schema_config:
      configs:
        - from: 2024-01-01
          store: boltdb-shipper
          object_store: s3
          schema: v12
          index:
            prefix: loki_index_
            period: 24h

    # Storage configuration
    storage_config:
      boltdb_shipper:
        active_index_directory: /loki/boltdb-shipper-active
        cache_location: /loki/boltdb-shipper-cache
        cache_ttl: 24h
        shared_store: s3
      aws:
        s3: s3://us-east-1/smart-tutor-prod-loki
        s3forcepathstyle: false
        bucketnames: smart-tutor-prod-loki
        region: us-east-1
        # Use IAM role in production
        # access_key_id: ${AWS_ACCESS_KEY_ID}
        # secret_access_key: ${AWS_SECRET_ACCESS_KEY}

    # Compactor
    compactor:
      working_directory: /loki/compactor
      shared_store: s3
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150

    # Limits configuration
    limits_config:
      enforce_metric_name: false
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20
      max_query_series: 500
      max_query_parallelism: 32
      max_streams_per_user: 10000
      max_global_streams_per_user: 0
      unordered_writes: true
      max_cache_freshness_per_query: 10m
      # Retention period (31 days)
      retention_period: 744h
      per_stream_rate_limit: 3MB
      per_stream_rate_limit_burst: 15MB

    # Chunk store configuration
    chunk_store_config:
      max_look_back_period: 0s
      chunk_cache_config:
        enable_fifocache: true
        fifocache:
          max_size_bytes: 500MB
          validity: 24h

    # Query range configuration
    query_range:
      align_queries_with_step: true
      max_retries: 5
      cache_results: true
      results_cache:
        cache:
          enable_fifocache: true
          fifocache:
            max_size_bytes: 500MB
            validity: 24h

    # Table manager (for retention)
    table_manager:
      retention_deletes_enabled: true
      retention_period: 744h

    # Ruler configuration
    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules
      rule_path: /loki/rules-temp
      alertmanager_url: http://alertmanager:9093
      ring:
        kvstore:
          store: inmemory
      enable_api: true
      enable_alertmanager_v2: true

    # Analytics
    analytics:
      reporting_enabled: false

    # Tracing (integrate with Jaeger)
    tracing:
      enabled: true
