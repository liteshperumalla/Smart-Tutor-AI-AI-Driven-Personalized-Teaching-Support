# Prometheus configuration for single-EC2 production
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'smart-ai-tutor-ec2'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - 'alerts.yml'

# Remote Write to Grafana Cloud Hosted Prometheus (Option A)
remote_write:
  - url: 'https://prometheus-prod-66-prod-us-east-3.grafana.net/api/prom/push'
    basic_auth:
      username: '3689873'
      password_file: '/etc/prometheus/grafana-cloud-token'
    send_exemplars: true
    queue_config:
      capacity: 10000
      max_shards: 10
      min_shards: 1
      max_samples_per_send: 500
      batch_send_deadline: 5s
      min_backoff: 100ms
      max_backoff: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  - job_name: 'backend-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['smart-tutor-backend:8000']
        labels:
          service: 'backend-api'
          app: 'smart-ai-tutor'
    scrape_interval: 10s

  # No 'frontend' job here: in production the Next.js frontend is deployed
  # to Vercel, not as a container on this EC2 host, so 'frontend:4000' never
  # resolves and FrontendDown fired permanently. Frontend availability is
  # covered by the Synthetic Production Monitor probing PRODUCTION_APP_URL.

  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          database: 'smart_tutor'
    scrape_interval: 30s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          cache: 'rag-cache'
    scrape_interval: 30s

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          instance: 'ec2-host'
    scrape_interval: 30s

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'
          instance: 'ec2-host'
    scrape_interval: 30s
