# Prometheus configuration for single-EC2 production
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'smart-ai-tutor-ec2'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - 'alerts.yml'

# Remote Write to Grafana Cloud / Managed Prometheus (Optional)
# To forward all metrics directly to your Grafana Cloud or AWS Managed Prometheus account:
# 1. Sign in to Grafana Cloud -> Prometheus -> "Send Metrics" / Settings
# 2. Uncomment and provide your endpoint URL and credentials:
# remote_write:
#   - url: 'https://prometheus-prod-XX-prod-us-central-0.grafana.net/api/prom/push'
#     basic_auth:
#       username: '<GRAFANA_CLOUD_PROMETHEUS_USER_ID>'
#       password: '<GRAFANA_CLOUD_API_TOKEN>'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  - job_name: 'backend-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['smart-tutor-backend:8000', 'backend:8000']
        labels:
          service: 'backend-api'
          app: 'smart-ai-tutor'
    scrape_interval: 10s

  - job_name: 'frontend'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['frontend:4000', 'smart-tutor-frontend:4000']
        labels:
          service: 'frontend'
          app: 'smart-ai-tutor-ui'
    scrape_interval: 30s

  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          database: 'smart_tutor'
    scrape_interval: 30s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          cache: 'rag-cache'
    scrape_interval: 30s

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          instance: 'ec2-host'
    scrape_interval: 30s

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'
          instance: 'ec2-host'
    scrape_interval: 30s
