name: CodeRabbit Code Review

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  coderabbit:
    name: Code Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run CodeRabbit
        uses: coderabbitai/coderabbit-action@v2
        with:
          config_path: .coderabbit.yaml
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
