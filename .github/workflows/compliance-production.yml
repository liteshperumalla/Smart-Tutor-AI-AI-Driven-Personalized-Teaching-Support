name: Production Compliance Scan

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

concurrency:
  group: production-compliance-scan
  cancel-in-progress: false

jobs:
  compliance-scan:
    name: SOC2 Compliance Scan
    runs-on: ubuntu-latest
    if: vars.ENABLE_PRODUCTION_COMPLIANCE == 'true'
    permissions:
      contents: read
    env:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install conftest
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/open-policy-agent/conftest/releases/download/v0.58.0/conftest_0.58.0_Linux_x86_64.tar.gz -o /tmp/conftest.tar.gz
          tar -xzf /tmp/conftest.tar.gz -C /tmp
          sudo mv /tmp/conftest /usr/local/bin/conftest

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.2

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.32.2

      - name: Install AWS CLI
        uses: unfor19/install-aws-cli-action@v1

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.2

      - name: Configure kubeconfig
        run: |
          set -euo pipefail
          if [ -z "${KUBE_CONFIG_DATA:-}" ]; then
            echo "KUBE_CONFIG_DATA not set; skipping cluster scans."
            exit 0
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_DATA" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Run compliance scan
        run: |
          set -euo pipefail
          chmod +x compliance/scans/compliance-scan.sh
          ./compliance/scans/compliance-scan.sh soc2

      - name: Upload compliance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-compliance-report
          path: /tmp/compliance-reports-*/
          if-no-files-found: warn
          retention-days: 30
