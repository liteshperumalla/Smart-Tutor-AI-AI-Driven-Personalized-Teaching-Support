name: Production Compliance Scan

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

concurrency:
  group: production-compliance-scan
  cancel-in-progress: false

jobs:
  compliance-scan:
    name: EC2 Compliance Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_APP_DIR: ${{ vars.EC2_APP_DIR || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required configuration
        run: |
          set -euo pipefail
          missing=()
          for name in EC2_HOST EC2_USER EC2_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required production compliance configuration."
            for item in "${missing[@]}"; do
              echo "::error::Missing required secret ${item}"
            done
            exit 1
          fi
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::warning::AWS inventory credentials are not configured. AWS account snapshot steps will be skipped."
          fi

      - name: Install AWS CLI
        if: ${{ env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' }}
        uses: unfor19/install-aws-cli-action@v1

      - name: Capture AWS compliance snapshot from runner
        if: ${{ env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/compliance-report
          mkdir -p /tmp/compliance-report/aws-fallback-needed

          capture_snapshot() {
            local name="$1"
            local target="$2"
            local empty_json="$3"
            shift 3

            if "$@" > "${target}"; then
              echo "Captured ${name} from runner."
            else
              echo "${empty_json}" > "${target}"
              touch "/tmp/compliance-report/aws-fallback-needed/${name}"
              echo "::warning::Unable to capture ${name} from runner; EC2 fallback will be attempted."
            fi
          }

          capture_snapshot "aws-identity" "/tmp/compliance-report/aws-identity.json" "{}" \
            aws sts get-caller-identity
          capture_snapshot "cloudtrail" "/tmp/compliance-report/cloudtrail.json" "{}" \
            aws cloudtrail describe-trails
          capture_snapshot "secrets-rotation" "/tmp/compliance-report/secrets-rotation.json" "[]" \
            aws secretsmanager list-secrets \
              --query 'SecretList[*].{Name:Name,Rotation:RotationEnabled,LastRotated:LastRotatedDate}' \
              --output json
          capture_snapshot "rds-config" "/tmp/compliance-report/rds-config.json" "[]" \
            aws rds describe-db-instances \
              --query 'DBInstances[*].{Name:DBInstanceIdentifier,Encrypted:StorageEncrypted,BackupRetention:BackupRetentionPeriod}' \
              --output json
          capture_snapshot "ec2-instance" "/tmp/compliance-report/ec2-instance.json" "[]" \
            aws ec2 describe-instances \
              --filters "Name=ip-address,Values=${EC2_HOST}" \
              --query 'Reservations[*].Instances[*].{InstanceId:InstanceId,State:State.Name,InstanceType:InstanceType,LaunchTime:LaunchTime,PublicIpAddress:PublicIpAddress,IMDSv2:MetadataOptions.HttpTokens,RootVolumeEncrypted:BlockDeviceMappings[0].Ebs.Encrypted,SecurityGroups:SecurityGroups[*].GroupId}' \
              --output json

      - name: Run remote EC2 compliance checks
        run: |
          set -euo pipefail

          mkdir -p /tmp/compliance-report
          key_file="$(mktemp)"
          printf '%s\n' "${EC2_SSH_KEY}" > "${key_file}"
          chmod 600 "${key_file}"
          remote_app_dir="$(printf '%q' "${EC2_APP_DIR}")"

          ssh -o StrictHostKeyChecking=no -o LogLevel=ERROR -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i "${key_file}" "${EC2_USER}@${EC2_HOST}" "EC2_APP_DIR=${remote_app_dir} bash -s" > /tmp/compliance-report/ec2-host-checks.txt <<'EOF'
          set -euo pipefail

          failures=0
          check() {
            local description="$1"
            shift
            if "$@"; then
              echo "[PASS] ${description}"
            else
              echo "[FAIL] ${description}"
              failures=$((failures + 1))
            fi
          }

          timed() {
            timeout "${1}"
            shift
            "$@"
          }

          backend_ready() {
            timed 15 curl -fsS --connect-timeout 2 --max-time 10 http://localhost:8010/ready >/dev/null \
              || timed 20 docker exec smart-tutor-backend curl -fsS --connect-timeout 2 --max-time 10 http://127.0.0.1:8000/ready >/dev/null
          }

          backend_health() {
            timed 20 curl -fsS --connect-timeout 2 --max-time 15 http://localhost:8010/health >/dev/null \
              || timed 25 docker exec smart-tutor-backend curl -fsS --connect-timeout 2 --max-time 15 http://127.0.0.1:8000/health >/dev/null
          }

          APP_DIR="${EC2_APP_DIR:-}"
          DATA_ROOT="/home/ubuntu/smart-tutor-data"

          check "docker installed" timed 10 command -v docker
          check "backend container running" timed 20 sh -c "docker ps --format '{{.Names}}' | grep -qx 'smart-tutor-backend'"
          check "backend readiness endpoint responds" backend_ready
          if backend_health; then
            echo "[PASS] backend health endpoint responds"
          else
            echo "[INFO] backend health endpoint is unavailable or degraded; readiness probe passed"
          fi
          check "shared logs directory exists" timed 10 test -d "${DATA_ROOT}/logs"
          check "shared user data directory exists" timed 10 test -d "${DATA_ROOT}/user_data"
          check "shared chroma directory exists" timed 10 test -d "${DATA_ROOT}/chroma_db"
          check "backend restart policy is unless-stopped" timed 20 sh -c "[ \"$(docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' smart-tutor-backend)\" = 'unless-stopped' ]"
          check "backend logs mount configured" timed 20 sh -c "docker inspect smart-tutor-backend | grep -q '/home/ubuntu/smart-tutor-data/logs'"
          if [ -n "${APP_DIR}" ]; then
            check "configured app directory exists" timed 10 test -d "${APP_DIR}"
          else
            echo "[INFO] No EC2_APP_DIR configured; skipping repo-directory check."
          fi

          echo ""
          echo "=== Running containers ==="
          timed 20 docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'

          if [ "${failures}" -gt 0 ]; then
            exit 1
          fi
          EOF

          rm -f "${key_file}"

      - name: Capture AWS compliance snapshot from EC2 fallback
        run: |
          set -uo pipefail

          mkdir -p /tmp/compliance-report
          mkdir -p /tmp/compliance-report/aws-fallback-needed

          needs_fallback=0
          for name in aws-identity cloudtrail secrets-rotation rds-config ec2-instance; do
            if [ -f "/tmp/compliance-report/aws-fallback-needed/${name}" ]; then
              needs_fallback=1
            fi
          done

          if [ "${needs_fallback}" -eq 0 ] && \
             [ -s /tmp/compliance-report/aws-identity.json ] && \
             [ -s /tmp/compliance-report/cloudtrail.json ] && \
             [ -s /tmp/compliance-report/secrets-rotation.json ] && \
             [ -s /tmp/compliance-report/rds-config.json ] && \
             [ -s /tmp/compliance-report/ec2-instance.json ]; then
            echo "Runner snapshot is complete; skipping EC2 fallback."
            exit 0
          fi

          key_file="$(mktemp)"
          printf '%s\n' "${EC2_SSH_KEY}" > "${key_file}"
          chmod 600 "${key_file}"

          capture_remote_snapshot() {
            local name="$1"
            local target="$2"
            local empty_json="$3"
            shift 3

            if [ ! -f "/tmp/compliance-report/aws-fallback-needed/${name}" ] && [ -s "${target}" ]; then
              return 0
            fi

            if ssh -o StrictHostKeyChecking=no -i "${key_file}" "${EC2_USER}@${EC2_HOST}" "command -v aws >/dev/null 2>&1 && $*" > "${target}"; then
              rm -f "/tmp/compliance-report/aws-fallback-needed/${name}"
              echo "Captured ${name} from EC2 fallback."
            else
              echo "${empty_json}" > "${target}"
              echo "::warning::Unable to capture ${name} from runner or EC2 host."
            fi
          }

          capture_remote_snapshot "aws-identity" "/tmp/compliance-report/aws-identity.json" "{}" \
            aws sts get-caller-identity
          capture_remote_snapshot "cloudtrail" "/tmp/compliance-report/cloudtrail.json" "{}" \
            aws cloudtrail describe-trails
          capture_remote_snapshot "secrets-rotation" "/tmp/compliance-report/secrets-rotation.json" "[]" \
            aws secretsmanager list-secrets --query "'SecretList[*].{Name:Name,Rotation:RotationEnabled,LastRotated:LastRotatedDate}'" --output json
          capture_remote_snapshot "rds-config" "/tmp/compliance-report/rds-config.json" "[]" \
            aws rds describe-db-instances --query "'DBInstances[*].{Name:DBInstanceIdentifier,Encrypted:StorageEncrypted,BackupRetention:BackupRetentionPeriod}'" --output json
          capture_remote_snapshot "ec2-instance" "/tmp/compliance-report/ec2-instance.json" "[]" \
            aws ec2 describe-instances --filters "Name=ip-address,Values=${EC2_HOST}" --query "'Reservations[*].Instances[*].{InstanceId:InstanceId,State:State.Name,InstanceType:InstanceType,LaunchTime:LaunchTime,PublicIpAddress:PublicIpAddress,IMDSv2:MetadataOptions.HttpTokens,RootVolumeEncrypted:BlockDeviceMappings[0].Ebs.Encrypted,SecurityGroups:SecurityGroups[*].GroupId}'" --output json

          rm -f "${key_file}"

      - name: Upload compliance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-compliance-report
          path: /tmp/compliance-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Compliance summary
        if: always()
        run: |
          set -euo pipefail

          report_dir="/tmp/compliance-report"
          host_report="${report_dir}/ec2-host-checks.txt"
          pass_count=0
          fail_count=0
          info_count=0

          if [ -f "${host_report}" ]; then
            pass_count="$(grep -c '^\[PASS\]' "${host_report}" || true)"
            fail_count="$(grep -c '^\[FAIL\]' "${host_report}" || true)"
            info_count="$(grep -c '^\[INFO\]' "${host_report}" || true)"
          fi

          aws_identity_status="missing"
          cloudtrail_status="missing"
          secrets_rotation_status="missing"
          rds_status="missing"
          ec2_status="missing"

          [ -s "${report_dir}/aws-identity.json" ] && aws_identity_status="captured"
          [ -s "${report_dir}/cloudtrail.json" ] && cloudtrail_status="captured"
          [ -s "${report_dir}/secrets-rotation.json" ] && secrets_rotation_status="captured"
          [ -s "${report_dir}/rds-config.json" ] && rds_status="captured"
          [ -s "${report_dir}/ec2-instance.json" ] && ec2_status="captured"

          {
            echo "## Production Compliance Summary"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Workflow trigger | \`${{ github.event_name }}\` |"
            echo "| Target host | \`${EC2_HOST}\` |"
            echo "| EC2 app directory | \`${EC2_APP_DIR:-not-configured}\` |"
            echo "| Host checks report | \`${host_report}\` $([ -f "${host_report}" ] && echo 'found' || echo 'missing') |"
            echo "| Passed checks | \`${pass_count}\` |"
            echo "| Failed checks | \`${fail_count}\` |"
            echo "| Informational checks | \`${info_count}\` |"
            echo "| AWS identity snapshot | \`${aws_identity_status}\` |"
            echo "| CloudTrail snapshot | \`${cloudtrail_status}\` |"
            echo "| Secrets rotation snapshot | \`${secrets_rotation_status}\` |"
            echo "| RDS config snapshot | \`${rds_status}\` |"
            echo "| EC2 inventory snapshot | \`${ec2_status}\` |"
            echo ""
            echo "Artifacts:"
            echo "- \`production-compliance-report\`"
            echo "- Remote host checks plus runner/EC2 AWS inventory snapshots"
          } >> "$GITHUB_STEP_SUMMARY"
