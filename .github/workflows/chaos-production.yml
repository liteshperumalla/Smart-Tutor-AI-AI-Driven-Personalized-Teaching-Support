name: Production Chaos Engineering

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: "Experiment set to apply"
        required: true
        default: weekly-workflow
        type: choice
        options:
          - weekly-workflow
          - pod-failure
          - network-chaos
          - http-chaos
          - stress-chaos
      dry_run:
        description: "Validate manifests only"
        required: true
        default: true
        type: boolean

concurrency:
  group: production-chaos
  cancel-in-progress: false

jobs:
  chaos:
    name: Apply Chaos Mesh Experiments
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required configuration
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.KUBE_CONFIG_DATA }}" ]; then
            echo "::error::Missing required secret KUBE_CONFIG_DATA"
            exit 1
          fi

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.32.2

      - name: Configure kubeconfig
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Select manifest
        id: manifest
        run: |
          set -euo pipefail
          case "${{ inputs.experiment }}" in
            weekly-workflow) manifest="chaos-engineering/workflows/weekly-chaos-workflow.yaml" ;;
            pod-failure) manifest="chaos-engineering/experiments/pod-failure.yaml" ;;
            network-chaos) manifest="chaos-engineering/experiments/network-chaos.yaml" ;;
            http-chaos) manifest="chaos-engineering/experiments/http-chaos.yaml" ;;
            stress-chaos) manifest="chaos-engineering/experiments/stress-chaos.yaml" ;;
            *) echo "::error::Unsupported experiment"; exit 1 ;;
          esac
          echo "path=$manifest" >> "$GITHUB_OUTPUT"

      - name: Validate manifests
        run: |
          set -euo pipefail
          kubectl apply --dry-run=server -f chaos-engineering/namespace.yaml
          kubectl apply --dry-run=server -f "${{ steps.manifest.outputs.path }}"

      - name: Apply chaos workflow
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          kubectl apply -f chaos-engineering/namespace.yaml
          kubectl apply -f "${{ steps.manifest.outputs.path }}"

      - name: Summary
        run: |
          {
            echo "## Chaos Engineering"
            echo ""
            echo "- Experiment: \`${{ inputs.experiment }}\`"
            echo "- Dry run: \`${{ inputs.dry_run }}\`"
            echo "- Manifest: \`${{ steps.manifest.outputs.path }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
