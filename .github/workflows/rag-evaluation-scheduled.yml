name: Scheduled RAG Evaluation

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      dataset_limit:
        type: string
        description: "Number of dataset questions to evaluate (overrides EVALUATION_DATASET_LIMIT)"
        required: false
        default: ""
      min_avg_correctness:
        type: string
        description: "Minimum average correctness score before the workflow fails"
        required: false
        default: ""
      min_avg_context_recall:
        type: string
        description: "Minimum average context recall score before the workflow fails"
        required: false
        default: ""
      max_avg_drift_score:
        type: string
        description: "Maximum average model drift score before the workflow fails"
        required: false
        default: ""
      enforce_quality_gates:
        type: string
        description: "Set to true to fail the workflow on score thresholds; defaults to false for monitoring runs"
        required: false
        default: ""
      model_id:
        type: string
        description: "Model ID to evaluate (overrides EVALUATION_MODEL_ID; leave blank for default)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: rag-evaluation-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  run-dataset-evaluation:
    name: Run Dataset Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # -----------------------------------------------------------------------
      # Step 1 — Validate required configuration before doing any network work
      # -----------------------------------------------------------------------
      - name: Validate required secrets and variables
        env:
          EVALUATION_BACKEND_URL: ${{ secrets.EVALUATION_BACKEND_URL || vars.EVALUATION_BACKEND_URL_PROD }}
          EVALUATION_CRON_TOKEN: ${{ secrets.EVALUATION_CRON_TOKEN }}
        run: |
          set -euo pipefail

          missing=()

          if [ -z "${EVALUATION_BACKEND_URL}" ]; then
            missing+=("EVALUATION_BACKEND_URL (secret) — base URL of your FastAPI backend, e.g. https://api.yourapp.com")
          fi

          if [ -z "${EVALUATION_CRON_TOKEN}" ]; then
            missing+=("EVALUATION_CRON_TOKEN (secret) — shared token validated by POST /evaluation/run-scheduled")
          fi

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::One or more required secrets are not configured in this repository."
            echo ""
            echo "Missing configuration:"
            for item in "${missing[@]}"; do
              echo "  ✗ $item"
            done
            echo ""
            echo "Fix: Go to  Settings → Secrets and variables → Actions → New repository secret"
            echo "     and add each missing value listed above."
            exit 1
          fi

          echo "✓ All required secrets are present."

      # -----------------------------------------------------------------------
      # Step 2 — Build payload and call the backend
      # -----------------------------------------------------------------------
      - name: Trigger scheduled evaluation
        env:
          EVALUATION_BACKEND_URL: ${{ secrets.EVALUATION_BACKEND_URL || vars.EVALUATION_BACKEND_URL_PROD }}
          EVALUATION_CRON_TOKEN: ${{ secrets.EVALUATION_CRON_TOKEN }}
          EC2_HOST: ${{ secrets.EC2_HOST || '' }}
          EC2_USER: ${{ secrets.EC2_USER || '' }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY || '' }}
          # workflow_dispatch inputs override the repo variable when provided
          EVALUATION_DATASET_LIMIT: ${{ inputs.dataset_limit || vars.EVALUATION_DATASET_LIMIT || '20' }}
          MIN_AVG_CORRECTNESS: ${{ inputs.min_avg_correctness || vars.MIN_AVG_CORRECTNESS || '0.55' }}
          MIN_AVG_CONTEXT_RECALL: ${{ inputs.min_avg_context_recall || vars.MIN_AVG_CONTEXT_RECALL || '0.55' }}
          MAX_AVG_DRIFT_SCORE: ${{ inputs.max_avg_drift_score || vars.MAX_AVG_DRIFT_SCORE || '2.50' }}
          EVALUATION_MODEL_ID: ${{ inputs.model_id || vars.EVALUATION_MODEL_ID || '' }}
          ENFORCE_QUALITY_GATES: ${{ inputs.enforce_quality_gates || vars.ENFORCE_QUALITY_GATES || 'false' }}
          WORKFLOW_TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Strip any accidental trailing slash from the URL so the path never
          # becomes double-slashed (e.g. https://api.example.com//evaluation/...)
          base_url="${EVALUATION_BACKEND_URL%/}"

          if [[ ! "${base_url}" =~ ^https?:// ]]; then
            echo "::error::EVALUATION_BACKEND_URL must start with http:// or https://"
            exit 1
          fi

          if [[ ! "${EVALUATION_DATASET_LIMIT}" =~ ^[0-9]+$ ]]; then
            echo "::error::EVALUATION_DATASET_LIMIT must be a positive integer. Received: ${EVALUATION_DATASET_LIMIT}"
            exit 1
          fi

          enforce_quality_gates="$(printf '%s' "${ENFORCE_QUALITY_GATES}" | tr '[:upper:]' '[:lower:]')"
          if [ "${WORKFLOW_TRIGGER}" != "workflow_dispatch" ]; then
            enforce_quality_gates="false"
          fi
          if [ "${enforce_quality_gates}" != "true" ] && [ "${enforce_quality_gates}" != "false" ]; then
            echo "::error::ENFORCE_QUALITY_GATES must be either true or false. Received: ${ENFORCE_QUALITY_GATES}"
            exit 1
          fi

          if [ "${EVALUATION_DATASET_LIMIT}" -lt 1 ] || [ "${EVALUATION_DATASET_LIMIT}" -gt 64 ]; then
            echo "::error::EVALUATION_DATASET_LIMIT must be between 1 and 64 to match backend validation. Received: ${EVALUATION_DATASET_LIMIT}"
            exit 1
          fi

          # Build JSON payload — only include model_id when explicitly set
          if [ -n "${EVALUATION_MODEL_ID}" ]; then
            payload="{\"limit\": ${EVALUATION_DATASET_LIMIT}, \"model_id\": \"${EVALUATION_MODEL_ID}\"}"
          else
            payload="{\"limit\": ${EVALUATION_DATASET_LIMIT}}"
          fi

          echo "Endpoint : ${base_url}/evaluation/run-scheduled"
          echo "Payload  : ${payload}"
          echo ""

          invoke_public_endpoint() {
            curl -sS \
              --fail-with-body \
              --max-time 300 \
              --retry 2 \
              --retry-delay 5 \
              --retry-all-errors \
              -X POST "${base_url}/evaluation/run-scheduled" \
              -H "Content-Type: application/json" \
              -H "X-Evaluation-Token: ${EVALUATION_CRON_TOKEN}" \
              -d "${payload}" \
              --output /tmp/eval_response.json \
              --write-out "%{http_code}" \
              || true
          }

          invoke_ec2_internal_endpoint() {
            if [ -z "${EC2_HOST}" ] || [ -z "${EC2_USER}" ] || [ -z "${EC2_SSH_KEY}" ]; then
              return 1
            fi

            local key_file
            local payload_b64
            local token_b64
            key_file="$(mktemp)"
            payload_b64="$(printf '%s' "${payload}" | base64 | tr -d '\n')"
            token_b64="$(printf '%s' "${EVALUATION_CRON_TOKEN}" | base64 | tr -d '\n')"
            printf '%s\n' "${EC2_SSH_KEY}" > "${key_file}"
            chmod 600 "${key_file}"

            if ssh -o StrictHostKeyChecking=no -i "${key_file}" "${EC2_USER}@${EC2_HOST}" \
              -o LogLevel=ERROR -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
              "EVALUATION_PAYLOAD_B64='${payload_b64}' EVALUATION_TOKEN_B64='${token_b64}' bash -lc 'payload=\$(printf %s \"\$EVALUATION_PAYLOAD_B64\" | base64 -d); token=\$(printf %s \"\$EVALUATION_TOKEN_B64\" | base64 -d); curl -sS --fail-with-body --max-time 300 -X POST http://127.0.0.1:8010/evaluation/run-scheduled -H \"Content-Type: application/json\" -H \"X-Evaluation-Token: \$token\" -d \"\$payload\"'" \
              > /tmp/eval_response.json 2>/tmp/eval_fallback_error.log
            then
              rm -f "${key_file}"
              return 0
            fi

            rm -f "${key_file}"
            return 1
          }

          # Prefer the internal backend path when EC2 credentials are available.
          # That keeps the scheduled evaluation independent of public nginx /
          # load balancer failures. Fall back to the public endpoint only when
          # internal execution is unavailable.
          response_source="public-api"
          http_code=""

          if invoke_ec2_internal_endpoint; then
            http_code="200"
            response_source="ec2-host-internal"
          else
            if [ -s /tmp/eval_fallback_error.log ]; then
              cp /tmp/eval_fallback_error.log /tmp/eval_response.json
            fi

            http_code="$(invoke_public_endpoint)"
          fi

          response=$(cat /tmp/eval_response.json 2>/dev/null || echo "(no response body)")

          response_is_json=false
          if [ -f /tmp/eval_response.json ] && jq empty /tmp/eval_response.json >/dev/null 2>&1; then
            response_is_json=true
          fi

          total_evaluated=""
          total_dataset_questions=""
          avg_latency=""
          quality_summary_type=""
          result_message=""
          avg_faithfulness=""
          avg_answer_relevance=""
          avg_context_recall=""
          avg_context_precision=""
          avg_correctness=""
          dataset_path=""
          drift_summary_type=""
          avg_drift_score=""
          max_drift_score=""
          high_drift_count=""
          recommendations_json="[]"
          delta_correctness=""
          delta_context_recall=""
          delta_avg_drift=""
          if [ "${response_is_json}" = "true" ]; then
            total_evaluated="$(jq -r '.total_evaluated // empty' /tmp/eval_response.json)"
            total_dataset_questions="$(jq -r '.total_dataset_questions // empty' /tmp/eval_response.json)"
            avg_latency="$(jq -r '.avg_latency // empty' /tmp/eval_response.json)"
            dataset_path="$(jq -r '.dataset_path // .run_record.dataset // empty' /tmp/eval_response.json)"
            quality_summary_type="$(jq -r 'if .quality_summary == null then "null" else (.quality_summary | type) end' /tmp/eval_response.json)"
            drift_summary_type="$(jq -r 'if .drift_summary == null then "null" else (.drift_summary | type) end' /tmp/eval_response.json)"
            result_message="$(jq -r '.message // empty' /tmp/eval_response.json)"
            avg_faithfulness="$(jq -r '.quality_summary.avg_faithfulness // empty' /tmp/eval_response.json)"
            avg_answer_relevance="$(jq -r '.quality_summary.avg_answer_relevance // empty' /tmp/eval_response.json)"
            avg_context_recall="$(jq -r '.quality_summary.avg_context_recall // empty' /tmp/eval_response.json)"
            avg_context_precision="$(jq -r '.quality_summary.avg_context_precision // empty' /tmp/eval_response.json)"
            avg_correctness="$(jq -r '.quality_summary.avg_correctness // empty' /tmp/eval_response.json)"
            avg_drift_score="$(jq -r '.drift_summary.avg_drift_score // empty' /tmp/eval_response.json)"
            max_drift_score="$(jq -r '.drift_summary.max_drift_score // empty' /tmp/eval_response.json)"
            high_drift_count="$(jq -r '.drift_summary.high_drift_count // empty' /tmp/eval_response.json)"
            recommendations_json="$(jq -c '.recommendations // []' /tmp/eval_response.json)"
            delta_correctness="$(jq -r '.run_record.summary.delta.avg_correctness // empty' /tmp/eval_response.json)"
            delta_context_recall="$(jq -r '.run_record.summary.delta.avg_context_recall // empty' /tmp/eval_response.json)"
            delta_avg_drift="$(jq -r '.run_record.summary.delta.avg_drift_score // empty' /tmp/eval_response.json)"
          fi

          if [ "${response_is_json}" = "true" ]; then
            jq \
              --arg http_code "${http_code}" \
              --arg dataset_limit "${EVALUATION_DATASET_LIMIT}" \
              --arg min_avg_correctness "${MIN_AVG_CORRECTNESS}" \
              --arg min_avg_context_recall "${MIN_AVG_CONTEXT_RECALL}" \
              --arg max_avg_drift_score "${MAX_AVG_DRIFT_SCORE}" \
              '{
                http_code: $http_code,
                dataset_limit: ($dataset_limit | tonumber),
                thresholds: {
                  min_avg_correctness: ($min_avg_correctness | tonumber),
                  min_avg_context_recall: ($min_avg_context_recall | tonumber),
                  max_avg_drift_score: ($max_avg_drift_score | tonumber)
                },
                response: .
              }' /tmp/eval_response.json > /tmp/eval_summary.json
          else
            printf '%s\n' "{\"http_code\":\"${http_code}\",\"dataset_limit\":\"${EVALUATION_DATASET_LIMIT}\",\"response_is_json\":false}" > /tmp/eval_summary.json
          fi

          # ── Write Job Summary ──────────────────────────────────────────────
          {
            echo "## Scheduled RAG Evaluation"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| HTTP Status | \`${http_code}\` |"
            echo "| Response Source | \`${response_source}\` |"
            echo "| Dataset Limit | \`${EVALUATION_DATASET_LIMIT}\` |"
            echo "| Model ID | \`${EVALUATION_MODEL_ID:-default}\` |"
            echo "| Enforce Quality Gates | \`${enforce_quality_gates}\` |"
            echo "| Triggered by | \`${{ github.event_name }}\` |"
            echo "| Run | [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            if [ "${response_is_json}" = "true" ]; then
              echo "| Total Evaluated | \`${total_evaluated:-unknown}\` |"
              echo "| Dataset Questions | \`${total_dataset_questions:-unknown}\` |"
              echo "| Dataset Path | \`${dataset_path:-unknown}\` |"
              echo "| Avg Latency | \`${avg_latency:-unknown}\` |"
              echo "| Quality Summary | \`${quality_summary_type}\` |"
              echo "| Drift Summary | \`${drift_summary_type}\` |"
              if [ "${quality_summary_type}" = "object" ]; then
                echo "| Avg Faithfulness | \`${avg_faithfulness:-unknown}\` |"
                echo "| Avg Answer Relevance | \`${avg_answer_relevance:-unknown}\` |"
                echo "| Avg Context Recall | \`${avg_context_recall:-unknown}\` |"
                echo "| Avg Context Precision | \`${avg_context_precision:-unknown}\` |"
                echo "| Avg Correctness | \`${avg_correctness:-unknown}\` |"
                echo "| Delta Correctness | \`${delta_correctness:-n/a}\` |"
                echo "| Delta Context Recall | \`${delta_context_recall:-n/a}\` |"
              fi
              if [ "${drift_summary_type}" = "object" ]; then
                echo "| Avg Drift Score | \`${avg_drift_score:-unknown}\` |"
                echo "| Max Drift Score | \`${max_drift_score:-unknown}\` |"
                echo "| High Drift Count | \`${high_drift_count:-unknown}\` |"
                echo "| Delta Avg Drift | \`${delta_avg_drift:-n/a}\` |"
              fi
            fi
            echo ""
            echo "### Recommendations"
            jq -r '.[]? | "- " + .' <<< "${recommendations_json}"
            echo ""
            echo "### Response Body"
            echo '```json'
            echo "${response}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # ── Fail the step if the backend returned an error ─────────────────
          if [ -z "${http_code}" ] || [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error::Backend returned HTTP ${http_code:-0}. See response body above for details."
            echo "Response: ${response}"
            exit 1
          fi

          if [ "${response_is_json}" != "true" ]; then
            echo "::error::Backend returned a successful HTTP status but the response body was not valid JSON."
            echo "Response: ${response}"
            exit 1
          fi

          if [ -z "${total_evaluated}" ] || [ "${total_evaluated}" = "0" ]; then
            echo "::error::Scheduled evaluation completed without evaluating any dataset questions."
            if [ -n "${result_message}" ]; then
              echo "Message: ${result_message}"
            fi
            exit 1
          fi

          if [ "${quality_summary_type}" = "null" ]; then
            echo "::error::Scheduled evaluation returned no quality summary."
            if [ -n "${result_message}" ]; then
              echo "Message: ${result_message}"
            fi
            exit 1
          fi

          if awk "BEGIN {exit !(${avg_correctness:-0} < ${MIN_AVG_CORRECTNESS})}"; then
            if [ "${enforce_quality_gates}" = "true" ]; then
              echo "::error::Average correctness ${avg_correctness:-0} is below required threshold ${MIN_AVG_CORRECTNESS}."
              exit 1
            fi
            echo "::warning::Average correctness ${avg_correctness:-0} is below advisory threshold ${MIN_AVG_CORRECTNESS}."
          fi

          if awk "BEGIN {exit !(${avg_context_recall:-0} < ${MIN_AVG_CONTEXT_RECALL})}"; then
            if [ "${enforce_quality_gates}" = "true" ]; then
              echo "::error::Average context recall ${avg_context_recall:-0} is below required threshold ${MIN_AVG_CONTEXT_RECALL}."
              exit 1
            fi
            echo "::warning::Average context recall ${avg_context_recall:-0} is below advisory threshold ${MIN_AVG_CONTEXT_RECALL}."
          fi

          if [ "${drift_summary_type}" = "object" ] && [ -n "${avg_drift_score}" ] && awk "BEGIN {exit !(${avg_drift_score:-0} > ${MAX_AVG_DRIFT_SCORE})}"; then
            if [ "${enforce_quality_gates}" = "true" ]; then
              echo "::error::Average drift score ${avg_drift_score:-0} exceeds maximum allowed threshold ${MAX_AVG_DRIFT_SCORE}."
              exit 1
            fi
            echo "::warning::Average drift score ${avg_drift_score:-0} exceeds advisory threshold ${MAX_AVG_DRIFT_SCORE}."
          fi

          echo "Result   : dataset=${dataset_path:-unknown}, total_evaluated=${total_evaluated}/${total_dataset_questions:-unknown}, avg_latency=${avg_latency:-unknown}s"
          if [ "${quality_summary_type}" = "object" ]; then
            echo "Quality  : faithfulness=${avg_faithfulness:-unknown}, answer_relevance=${avg_answer_relevance:-unknown}, context_recall=${avg_context_recall:-unknown}, context_precision=${avg_context_precision:-unknown}, correctness=${avg_correctness:-unknown}"
          fi
          if [ "${drift_summary_type}" = "object" ]; then
            echo "Drift    : avg=${avg_drift_score:-unknown}, max=${max_drift_score:-unknown}, high_drift_count=${high_drift_count:-unknown}"
          fi
          echo "✓ Evaluation triggered successfully (HTTP ${http_code})."

      - name: Upload evaluation response artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-evaluation-response-${{ github.run_id }}
          path: |
            /tmp/eval_response.json
            /tmp/eval_summary.json
          if-no-files-found: ignore
