name: Production Observability Bootstrap

on:
  workflow_dispatch:
    inputs:
      app_dir:
        type: string
        description: "EC2 app directory"
        required: false
        default: ""

concurrency:
  group: production-observability
  cancel-in-progress: false

jobs:
  observability:
    name: Deploy Monitoring Stack On EC2
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
      EC2_APP_DIR: ${{ inputs.app_dir || vars.EC2_APP_DIR || '/home/ubuntu/smart-tutor' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required configuration
        run: |
          set -euo pipefail
          missing=()
          for name in EC2_HOST EC2_USER EC2_SSH_KEY GRAFANA_ADMIN_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required production observability configuration."
            for item in "${missing[@]}"; do
              echo "::error::Missing required secret ${item}"
            done
            exit 1
          fi

      - name: Bootstrap observability stack on EC2
        run: |
          set -euo pipefail

          key_file="$(mktemp)"
          printf '%s\n' "${EC2_SSH_KEY}" > "${key_file}"
          chmod 600 "${key_file}"
          remote_app_dir="$(printf '%q' "${EC2_APP_DIR}")"
          remote_grafana_password="$(printf '%q' "${GRAFANA_ADMIN_PASSWORD}")"

          ssh -o StrictHostKeyChecking=no -i "${key_file}" "${EC2_USER}@${EC2_HOST}" "EC2_APP_DIR=${remote_app_dir} GRAFANA_ADMIN_PASSWORD=${remote_grafana_password} bash -s" <<'EOF'
          set -euo pipefail

          APP_DIR="${EC2_APP_DIR:-/home/ubuntu/smart-tutor}"
          cd "${APP_DIR}"

          command -v docker >/dev/null
          docker compose version >/dev/null

          cat > .env.observability <<ENVFILE
          GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
          GRAFANA_PORT_EXPOSE=3001
          GRAFANA_ROOT_URL=http://localhost:3001
          ENVFILE

          docker network inspect smart-tutor_smart-tutor-network >/dev/null 2>&1 || \
            docker network create smart-tutor_smart-tutor-network

          docker compose --env-file .env.observability -f docker-compose.observability.yml up -d

          curl -fsS http://127.0.0.1:9090/-/ready >/dev/null
          curl -fsS http://127.0.0.1:3001/api/health >/dev/null
          curl -fsS http://127.0.0.1:9100/metrics >/dev/null
          curl -fsS http://127.0.0.1:8080/metrics >/dev/null

          docker compose --env-file .env.observability -f docker-compose.observability.yml ps
          EOF

          rm -f "${key_file}"

      - name: Summary
        run: |
          {
            echo "## Production Observability"
            echo ""
            echo "- Target: \`${EC2_HOST}\`"
            echo "- App directory: \`${EC2_APP_DIR}\`"
            echo "- Stack file: \`docker-compose.observability.yml\`"
            echo "- Services: \`prometheus\`, \`grafana\`, \`node-exporter\`, \`cadvisor\`"
            echo "- Prometheus readiness and Grafana health checks completed"
          } >> "$GITHUB_STEP_SUMMARY"
