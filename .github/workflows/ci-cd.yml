name: CI Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - helm/smart-ai-tutor/values-production.yaml
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20.20.2"
  REGISTRY: ghcr.io
  IMAGE_NAME: liteshperumalla/smart-tutor-ai-ai-driven-personalized-teaching-support

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@v3.88.0
        if: >-
          github.event_name == 'pull_request' ||
          (github.event.before != github.sha &&
           github.event.before != '0000000000000000000000000000000000000000')
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  dependency-scanning:
    name: Dependency Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [secret-scanning]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Python dependency audit
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pip-audit
          : > pip-audit.json
          audit_exit=0
          pip-audit --requirement backend/requirements.txt --format json --output pip-audit.json || audit_exit=$?
          if [ ! -s pip-audit.json ]; then
            echo "::error::pip-audit failed before producing a report."
            exit "$audit_exit"
          fi
          finding_count="$(jq 'length' pip-audit.json)"
          echo "### Python dependency audit" >> "$GITHUB_STEP_SUMMARY"
          echo "Known vulnerable packages reported: $finding_count" >> "$GITHUB_STEP_SUMMARY"
          if [ "$audit_exit" -ne 0 ]; then
            echo "::warning::pip-audit reported known vulnerabilities; the report was uploaded for remediation tracking."
          fi

      - name: npm audit (frontend)
        run: |
          set -euo pipefail
          cd frontend
          npm ci --legacy-peer-deps
          npm_audit_exit=0
          npm audit --omit=dev --json > npm-audit.json || npm_audit_exit=$?
          if [ ! -s npm-audit.json ]; then
            echo "::error::npm audit failed before producing a report."
            exit "$npm_audit_exit"
          fi
          high_and_critical_count="$(jq '.metadata.vulnerabilities.high + .metadata.vulnerabilities.critical' npm-audit.json)"
          echo "### Frontend dependency audit" >> "$GITHUB_STEP_SUMMARY"
          echo "High/critical findings: $high_and_critical_count" >> "$GITHUB_STEP_SUMMARY"
          if [ "$npm_audit_exit" -ne 0 ]; then
            echo "::warning::npm audit reported known vulnerabilities; the report was uploaded for remediation tracking."
          fi

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            pip-audit.json
            frontend/npm-audit.json
          if-no-files-found: warn
          retention-days: 30

  environment-discipline:
    name: Environment Discipline
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [secret-scanning]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate environment contracts
        run: |
          set -euo pipefail
          python scripts/check-env-drift.py

  sast:
    name: SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    needs: [secret-scanning]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Semgrep
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep SAST scan
        run: |
          set -euo pipefail
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/python \
            --config p/typescript \
            --exclude node_modules \
            --exclude .next \
            --exclude coverage \
            --sarif \
            --output semgrep.sarif \
            .
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/python \
            --config p/typescript \
            --exclude node_modules \
            --exclude .next \
            --exclude coverage \
            --severity ERROR \
            --error \
            .

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep-sast

      - name: Upload SAST artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: semgrep.sarif
          if-no-files-found: warn
          retention-days: 30

  dast:
    name: DAST
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    needs: [backend-tests]
    env:
      ENVIRONMENT: development
      SECRETS_PROVIDER: env
      STORAGE_BACKEND: filesystem
      USE_REDIS_CACHE: "false"
      REDIS_SSL: "false"
      AGENT_SYSTEM_ENABLED: "false"
      WARMUP_ENABLED: "false"
      REPRODUCIBILITY_ENABLED: "false"
      LANGFUSE_ENABLED: "false"
      OTEL_ENABLED: "false"
      CORS_ALLOW_LOCALHOST: "true"
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8010
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Start backend locally for DAST
        run: |
          set -euo pipefail
          mkdir -p logs
          nohup python -m uvicorn backend.api.main:app --host 127.0.0.1 --port 8010 > logs/dast-backend.log 2>&1 &
          echo $! > /tmp/dast-backend.pid

      - name: Wait for backend readiness
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8010/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Backend did not become ready for DAST."
          tail -n 200 logs/dast-backend.log || true
          exit 1

      - name: Run OWASP ZAP baseline scan
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/zap"
          chmod 777 "${RUNNER_TEMP}/zap"
          printf '10049\tIGNORE\tAccepted informational cacheability finding for public discovery routes\n' > "${RUNNER_TEMP}/zap/baseline.conf"
          set +e
          docker run --rm --network host \
            -v "${RUNNER_TEMP}/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://127.0.0.1:8010 \
              -c baseline.conf \
              -r zap-report.html \
              -J zap-report.json \
              -w zap-warnings.md \
              -m 3
          zap_exit_code=$?
          set -e
          cp "${RUNNER_TEMP}/zap"/zap-report.html "${GITHUB_WORKSPACE}/zap-report.html"
          cp "${RUNNER_TEMP}/zap"/zap-report.json "${GITHUB_WORKSPACE}/zap-report.json"
          cp "${RUNNER_TEMP}/zap"/zap-warnings.md "${GITHUB_WORKSPACE}/zap-warnings.md"
          exit "${zap_exit_code}"

      - name: Upload DAST artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-report
          path: |
            zap-report.html
            zap-report.json
            zap-warnings.md
            logs/dast-backend.log
          if-no-files-found: warn
          retention-days: 30

      - name: Stop backend
        if: always()
        run: |
          set -euo pipefail
          if [ -f /tmp/dast-backend.pid ]; then
            kill "$(cat /tmp/dast-backend.pid)" || true
          fi

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    needs: [secret-scanning]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run tests
        env:
          ENVIRONMENT: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          PYTHONPATH: .
        run: |
          set -euo pipefail
          pytest backend/tests/ -v \
            --cov=backend \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=backend/junit.xml \
            --maxfail=5

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: backend/junit.xml
          check_name: Backend Test Results

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: ${{ vars.ENABLE_CODECOV == 'true' }}
        with:
          file: ./coverage.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Backend summary
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import xml.etree.ElementTree as ET

          junit_path = Path("backend/junit.xml")
          coverage_path = Path("coverage.xml")

          tests = failures = errors = skipped = 0
          if junit_path.exists():
              root = ET.parse(junit_path).getroot()
              if root.tag == "testsuites":
                  tests = int(root.attrib.get("tests", 0))
                  failures = int(root.attrib.get("failures", 0))
                  errors = int(root.attrib.get("errors", 0))
                  skipped = int(root.attrib.get("skipped", 0))
              else:
                  tests = int(root.attrib.get("tests", 0))
                  failures = int(root.attrib.get("failures", 0))
                  errors = int(root.attrib.get("errors", 0))
                  skipped = int(root.attrib.get("skipped", 0))

          coverage_pct = "n/a"
          if coverage_path.exists():
              root = ET.parse(coverage_path).getroot()
              line_rate = root.attrib.get("line-rate")
              if line_rate is not None:
                  coverage_pct = f"{float(line_rate) * 100:.2f}%"

          print("## Backend Summary")
          print()
          print("| Item | Value |")
          print("|------|-------|")
          print("| Python | `${{ env.PYTHON_VERSION }}` |")
          print(f"| Test report | `{junit_path}` {'found' if junit_path.exists() else 'missing'} |")
          print(f"| Tests | `{tests}` |")
          print(f"| Failures | `{failures}` |")
          print(f"| Errors | `{errors}` |")
          print(f"| Skipped | `{skipped}` |")
          print(f"| Coverage XML | `{coverage_path}` {'found' if coverage_path.exists() else 'missing'} |")
          print(f"| Line coverage | `{coverage_pct}` |")
          print()
          print("Executed:")
          print("- `pytest backend/tests/ -v --cov=backend --cov-report=xml --cov-report=term-missing --junitxml=backend/junit.xml --maxfail=5`")
          PY

  migration-validation:
    name: Migration Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [secret-scanning]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: migration_validation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: migration_validation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_SSL_MODE: disable
      SECRETS_PROVIDER: env
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate migrations
        run: |
          set -euo pipefail
          chmod +x scripts/validate-migrations.sh
          ./scripts/validate-migrations.sh

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [secret-scanning]
    env:
      NEXT_PUBLIC_API_BASE_URL: /api/backend
      BACKEND_API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_APP_BASE_URL: http://localhost:4000
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-google-client-id
      NEXT_PUBLIC_GOOGLE_REDIRECT_URI: http://localhost:4000/auth/google/callback
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          set -euo pipefail
          cd frontend
          npm ci --legacy-peer-deps

      - name: TypeScript type check
        run: |
          set -euo pipefail
          cd frontend
          npm run type-check

      - name: Lint
        run: |
          set -euo pipefail
          cd frontend
          npm run lint

      - name: Unit tests
        run: |
          set -euo pipefail
          cd frontend
          npm test -- --coverage --watchAll=false --passWithNoTests --maxWorkers=2

      - name: Build
        run: |
          set -euo pipefail
          cd frontend
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Frontend summary
        if: always()
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const path = require('path');

          const coveragePath = path.join('frontend', 'coverage', 'coverage-summary.json');
          const nextPath = path.join('frontend', '.next');
          let coverage = 'n/a';
          let statements = 'n/a';
          let branches = 'n/a';
          let functions = 'n/a';
          let lines = 'n/a';

          if (fs.existsSync(coveragePath)) {
            const raw = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
            const total = raw.total || {};
            statements = total.statements ? `${total.statements.pct}%` : 'n/a';
            branches = total.branches ? `${total.branches.pct}%` : 'n/a';
            functions = total.functions ? `${total.functions.pct}%` : 'n/a';
            lines = total.lines ? `${total.lines.pct}%` : 'n/a';
            coverage = 'found';
          }

          console.log('## Frontend Summary');
          console.log('');
          console.log('| Item | Value |');
          console.log('|------|-------|');
          console.log(`| Node.js | \`${process.env.NODE_VERSION}\` |`);
          console.log(`| Coverage summary | \`${coveragePath}\` ${coverage} |`);
          console.log(`| Statement coverage | \`${statements}\` |`);
          console.log(`| Branch coverage | \`${branches}\` |`);
          console.log(`| Function coverage | \`${functions}\` |`);
          console.log(`| Line coverage | \`${lines}\` |`);
          console.log(`| Build artifact | \`${nextPath}\` ${fs.existsSync(nextPath) ? 'found' : 'missing'} |`);
          console.log('');
          console.log('Executed:');
          console.log('- `npm run type-check`');
          console.log('- `npm run lint`');
          console.log('- `npm test -- --coverage --watchAll=false --passWithNoTests --maxWorkers=2`');
          console.log('- `npm run build`');
          NODE

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [secret-scanning]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          set -euo pipefail
          cd frontend
          npm ci --legacy-peer-deps

      - name: Run proxy contract tests
        run: |
          set -euo pipefail
          cd frontend
          npm test -- --runInBand --testPathPattern route-contract --watchAll=false

  container-smoke:
    name: Container Smoke Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [secret-scanning]
    env:
      NEXT_PUBLIC_API_BASE_URL: /api/backend
      BACKEND_API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_APP_BASE_URL: http://localhost:4000
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-google-client-id
      NEXT_PUBLIC_GOOGLE_REDIRECT_URI: http://localhost:4000/auth/google/callback
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend container
        run: |
          set -euo pipefail
          docker build --tag smart-tutor-backend:ci --file backend/Dockerfile .

      - name: Verify backend container runtime
        run: |
          set -euo pipefail
          docker run --rm \
            -e ENVIRONMENT=test \
            smart-tutor-backend:ci \
            python -c "from backend.api.main import app; print(app.title)"

      - name: Build frontend container
        run: |
          set -euo pipefail
          docker build --tag smart-tutor-frontend:ci --file frontend/Dockerfile frontend \
            --build-arg NEXT_PUBLIC_API_BASE_URL="$NEXT_PUBLIC_API_BASE_URL" \
            --build-arg BACKEND_API_BASE_URL="$BACKEND_API_BASE_URL" \
            --build-arg NEXT_PUBLIC_APP_BASE_URL="$NEXT_PUBLIC_APP_BASE_URL" \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID="$NEXT_PUBLIC_GOOGLE_CLIENT_ID" \
            --build-arg NEXT_PUBLIC_GOOGLE_REDIRECT_URI="$NEXT_PUBLIC_GOOGLE_REDIRECT_URI"

      - name: Verify frontend container responds
        run: |
          set -euo pipefail
          docker run --detach --rm --name smart-tutor-frontend-ci -p 4000:4000 smart-tutor-frontend:ci
          trap 'docker logs smart-tutor-frontend-ci || true; docker stop smart-tutor-frontend-ci || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4000/ >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -lt 30 ]; then
              sleep 2
            fi
          done
          echo "::error::Frontend container did not become ready."
          exit 1

  public-ui-e2e:
    name: Public UI E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [frontend-tests]
    env:
      NEXT_PUBLIC_API_BASE_URL: /api/backend
      BACKEND_API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_APP_BASE_URL: http://localhost:4000
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-google-client-id
      NEXT_PUBLIC_GOOGLE_REDIRECT_URI: http://localhost:4000/auth/google/callback
      E2E_SKIP_WEBSERVER: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and build
        run: |
          set -euo pipefail
          cd frontend
          npm ci --legacy-peer-deps
          npm run build

      - name: Install Chromium
        run: |
          set -euo pipefail
          cd frontend
          npx playwright install --with-deps chromium

      - name: Start frontend
        run: |
          set -euo pipefail
          cd frontend
          npm run start -- -p 4000 > ../public-ui-e2e.log 2>&1 &
          echo $! > ../public-ui-e2e.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4000/ >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -lt 30 ]; then
              sleep 2
            fi
          done
          cat ../public-ui-e2e.log
          exit 1

      - name: Run public browser checks
        run: |
          set -euo pipefail
          cd frontend
          npx playwright test --config=playwright.public.config.ts --project=chromium

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-ui-e2e-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
            public-ui-e2e.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop frontend
        if: always()
        run: |
          if [ -f public-ui-e2e.pid ]; then
            kill "$(cat public-ui-e2e.pid)" || true
          fi

  security-management:
    name: Security Management
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    needs:
      - secret-scanning
      - dependency-scanning
      - sast
      - dast
      - backend-tests
      - frontend-tests
    steps:
      - name: Publish security posture summary
        run: |
          set -euo pipefail

          security_failed=0
          for result in \
            "${{ needs.secret-scanning.result }}" \
            "${{ needs.dependency-scanning.result }}" \
            "${{ needs.sast.result }}" \
            "${{ needs.dast.result }}"; do
            if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ]; then
              security_failed=1
            fi
          done

          {
            echo "## Security Management Summary"
            echo ""
            echo "| Control | Status |"
            echo "|---------|--------|"
            echo "| Secret scanning | \`${{ needs.secret-scanning.result }}\` |"
            echo "| Dependency scanning | \`${{ needs.dependency-scanning.result }}\` |"
            echo "| SAST | \`${{ needs.sast.result }}\` |"
            echo "| DAST | \`${{ needs.dast.result }}\` |"
            echo "| Backend tests | \`${{ needs.backend-tests.result }}\` |"
            echo "| Frontend tests | \`${{ needs.frontend-tests.result }}\` |"
            echo ""
            echo "Artifacts generated by CI security controls:"
            echo "- Secret scan and dependency scan reports"
            echo "- Semgrep SARIF uploaded to GitHub Security"
            echo "- OWASP ZAP baseline HTML/JSON reports"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${security_failed}" -ne 0 ]; then
            echo "::error::One or more security controls failed in CI."
            exit 1
          fi

  delivery-readiness:
    name: Delivery Readiness
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    needs:
      - backend-tests
      - frontend-tests
      - contract-tests
      - container-smoke
      - public-ui-e2e
      - migration-validation
      - environment-discipline
      - security-management
    steps:
      - name: Publish delivery summary
        run: |
          set -euo pipefail

          delivery_failed=0
          for result in \
            "${{ needs.backend-tests.result }}" \
            "${{ needs.frontend-tests.result }}" \
            "${{ needs.contract-tests.result }}" \
            "${{ needs.container-smoke.result }}" \
            "${{ needs.public-ui-e2e.result }}" \
            "${{ needs.migration-validation.result }}" \
            "${{ needs.environment-discipline.result }}" \
            "${{ needs.security-management.result }}"; do
            if [ "${result}" = "failure" ] || [ "${result}" = "cancelled" ]; then
              delivery_failed=1
            fi
          done

          {
            echo "## Delivery Readiness Summary"
            echo ""
            echo "| Gate | Status |"
            echo "|------|--------|"
            echo "| Backend tests | \`${{ needs.backend-tests.result }}\` |"
            echo "| Frontend tests | \`${{ needs.frontend-tests.result }}\` |"
            echo "| Contract tests | \`${{ needs.contract-tests.result }}\` |"
            echo "| Container smoke tests | \`${{ needs.container-smoke.result }}\` |"
            echo "| Public UI E2E | \`${{ needs.public-ui-e2e.result }}\` |"
            echo "| Migration validation | \`${{ needs.migration-validation.result }}\` |"
            echo "| Environment discipline | \`${{ needs.environment-discipline.result }}\` |"
            echo "| Security management | \`${{ needs.security-management.result }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${delivery_failed}" -ne 0 ]; then
            echo "::error::Delivery readiness gates did not pass."
            exit 1
          fi
