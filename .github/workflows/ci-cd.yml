name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20.9.0'
  REGISTRY: ghcr.io
  IMAGE_NAME: liteshperumalla/smart-tutor-ai-ai-driven-personalized-teaching-support

# Cancel in-flight runs for the same branch/PR on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ================================================================
  # 1. SECRET SCANNING
  #    Blocks all subsequent jobs if credentials are detected in code
  # ================================================================
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate diff scanning

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@v3.88.0
        if: >-
          github.event_name == 'pull_request' ||
          (github.event.before != github.sha &&
           github.event.before != '0000000000000000000000000000000000000000')
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  # ================================================================
  # 2. DEPENDENCY SCANNING
  #    Audits Python and npm packages for known CVEs
  # ================================================================
  dependency-scanning:
    name: Dependency Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [secret-scanning]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Python safety check
        run: |
          pip install safety
          safety check --file=backend/requirements.txt --json --output safety-report.json || true

      - name: npm audit (frontend)
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm audit --audit-level=critical

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: safety-report.json
          retention-days: 30

  # ================================================================
  # 3. BACKEND TESTS
  #    Pytest suite with real PostgreSQL + Redis service containers
  # ================================================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write        # Required by EnricoMi/publish-unit-test-result-action
      pull-requests: write # Required for PR comments on test results
    needs: [secret-scanning]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run tests
        env:
          ENVIRONMENT: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          PYTHONPATH: .
        run: |
          pytest backend/tests/ -v \
            --cov=backend \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=backend/junit.xml \
            --maxfail=5

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: backend/junit.xml
          check_name: Backend Test Results

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: ${{ vars.ENABLE_CODECOV == 'true' }}
        with:
          file: ./coverage.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

  # ================================================================
  # 4. FRONTEND TESTS
  #    TypeScript check, ESLint, Jest unit tests, and next build
  # ================================================================
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [secret-scanning]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci --legacy-peer-deps

      - name: TypeScript type check
        continue-on-error: true
        run: cd frontend && npm run type-check

      - name: Lint
        continue-on-error: true
        run: cd frontend && npm run lint

      - name: Unit tests
        run: |
          cd frontend
          npm test -- --coverage --watchAll=false --passWithNoTests --maxWorkers=2

      - name: Build
        run: cd frontend && npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next
          retention-days: 7

  # ================================================================
  # 5. BUILD & DEPLOY
  #    Runs only on pushes to main, after both test jobs pass.
  #    - Builds Docker images and pushes to GHCR
  #    - SSHes into EC2 and hot-swaps the backend container
  #    - Frontend auto-deploys via Vercel's GitHub integration
  #
  #    Required GitHub Secrets:
  #      EC2_HOST     — public IP or hostname of your EC2 instance
  #      EC2_USER     — SSH username (e.g. ubuntu)
  #      EC2_SSH_KEY  — private key content (e.g. ~/.ssh/smart-tutor-ec2.pem)
  # ================================================================
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write  # Required to push images to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate version tag
        id: version
        run: echo "version=$(date +%Y%m%d)-${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy backend to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          BACKEND_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ steps.version.outputs.version }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_TOKEN,ACTOR,BACKEND_IMAGE
          script: |
            set -e

            echo "=== Authenticating with GHCR ==="
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

            echo "=== Stopping existing backend container ==="
            docker stop smart-tutor-backend 2>/dev/null || true
            docker rm   smart-tutor-backend 2>/dev/null || true

            echo "=== Freeing disk space before pull ==="
            docker images --format '{{.Repository}}:{{.Tag}}' | grep 'smart-tutor.*backend' | xargs -r docker rmi -f || true
            docker image prune -f || true

            echo "=== Pulling image: $BACKEND_IMAGE ==="
            docker pull "$BACKEND_IMAGE"

            echo "=== Starting new backend container ==="
            docker run -d \
              --name smart-tutor-backend \
              --restart unless-stopped \
              --network smart-tutor_smart-tutor-network \
              --env-file ~/smart-tutor.env \
              -p 8010:8000 \
              -v /home/ubuntu/smart-tutor-data/logs:/app/logs \
              -v /home/ubuntu/smart-tutor-data/user_data:/app/user_data \
              -v /home/ubuntu/smart-tutor-data/chroma_db:/app/chroma_db \
              "$BACKEND_IMAGE" \
              uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --workers 1

            echo "=== Waiting for backend health check ==="
            for i in $(seq 1 12); do
              if curl -sf http://localhost:8010/health > /dev/null; then
                echo "✅ Backend healthy after $((i * 5))s"
                break
              fi
              if [ "$i" -eq 12 ]; then
                echo "❌ Backend failed health check after 60s"
                docker logs smart-tutor-backend --tail 50
                exit 1
              fi
              echo "  Attempt $i/12 — retrying in 5s..."
              sleep 5
            done

            echo "=== Pruning old images (>24h) ==="
            docker image prune -f --filter "until=24h" || true

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend** | ✅ Deployed | EC2 · version \`${{ steps.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend** | ✅ Auto-deployed | Vercel (triggered by push to \`main\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend Image** | Published | \`ghcr.io/${{ env.IMAGE_NAME }}-backend:${{ steps.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend Image** | Published | \`ghcr.io/${{ env.IMAGE_NAME }}-frontend:${{ steps.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
