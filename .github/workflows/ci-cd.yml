name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - helm/smart-ai-tutor/values-production.yaml
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20.9.0"
  REGISTRY: ghcr.io
  IMAGE_NAME: liteshperumalla/smart-tutor-ai-ai-driven-personalized-teaching-support
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@v3.88.0
        if: >-
          github.event_name == 'pull_request' ||
          (github.event.before != github.sha &&
           github.event.before != '0000000000000000000000000000000000000000')
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  dependency-scanning:
    name: Dependency Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [secret-scanning]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Python safety check
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "safety<4"
          touch safety-report.json
          safety check --file=backend/requirements.txt --json --output safety-report.json || true

      - name: npm audit (frontend)
        run: |
          set -euo pipefail
          cd frontend
          npm ci --legacy-peer-deps
          npm audit --audit-level=critical

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: safety-report.json
          if-no-files-found: warn
          retention-days: 30

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    needs: [secret-scanning]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run tests
        env:
          ENVIRONMENT: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          PYTHONPATH: .
        run: |
          set -euo pipefail
          pytest backend/tests/ -v \
            --cov=backend \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=backend/junit.xml \
            --maxfail=5

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: backend/junit.xml
          check_name: Backend Test Results

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: ${{ vars.ENABLE_CODECOV == 'true' }}
        with:
          file: ./coverage.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Backend summary
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import xml.etree.ElementTree as ET

          junit_path = Path("backend/junit.xml")
          coverage_path = Path("coverage.xml")

          tests = failures = errors = skipped = 0
          if junit_path.exists():
              root = ET.parse(junit_path).getroot()
              if root.tag == "testsuites":
                  tests = int(root.attrib.get("tests", 0))
                  failures = int(root.attrib.get("failures", 0))
                  errors = int(root.attrib.get("errors", 0))
                  skipped = int(root.attrib.get("skipped", 0))
              else:
                  tests = int(root.attrib.get("tests", 0))
                  failures = int(root.attrib.get("failures", 0))
                  errors = int(root.attrib.get("errors", 0))
                  skipped = int(root.attrib.get("skipped", 0))

          coverage_pct = "n/a"
          if coverage_path.exists():
              root = ET.parse(coverage_path).getroot()
              line_rate = root.attrib.get("line-rate")
              if line_rate is not None:
                  coverage_pct = f"{float(line_rate) * 100:.2f}%"

          print("## Backend Summary")
          print()
          print("| Item | Value |")
          print("|------|-------|")
          print("| Python | `${{ env.PYTHON_VERSION }}` |")
          print(f"| Test report | `{junit_path}` {'found' if junit_path.exists() else 'missing'} |")
          print(f"| Tests | `{tests}` |")
          print(f"| Failures | `{failures}` |")
          print(f"| Errors | `{errors}` |")
          print(f"| Skipped | `{skipped}` |")
          print(f"| Coverage XML | `{coverage_path}` {'found' if coverage_path.exists() else 'missing'} |")
          print(f"| Line coverage | `{coverage_pct}` |")
          print()
          print("Executed:")
          print("- `pytest backend/tests/ -v --cov=backend --cov-report=xml --cov-report=term-missing --junitxml=backend/junit.xml --maxfail=5`")
          PY

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [secret-scanning]
    env:
      NEXT_PUBLIC_API_BASE_URL: /api/backend
      BACKEND_API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_APP_BASE_URL: http://localhost:4000
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-google-client-id
      NEXT_PUBLIC_GOOGLE_REDIRECT_URI: http://localhost:4000/auth/google/callback
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          set -euo pipefail
          cd frontend
          npm ci --legacy-peer-deps

      - name: TypeScript type check
        run: |
          set -euo pipefail
          cd frontend
          npm run type-check

      - name: Lint
        run: |
          set -euo pipefail
          cd frontend
          npm run lint

      - name: Unit tests
        run: |
          set -euo pipefail
          cd frontend
          npm test -- --coverage --watchAll=false --passWithNoTests --maxWorkers=2

      - name: Build
        run: |
          set -euo pipefail
          cd frontend
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Frontend summary
        if: always()
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const path = require('path');

          const coveragePath = path.join('frontend', 'coverage', 'coverage-summary.json');
          const nextPath = path.join('frontend', '.next');
          let coverage = 'n/a';
          let statements = 'n/a';
          let branches = 'n/a';
          let functions = 'n/a';
          let lines = 'n/a';

          if (fs.existsSync(coveragePath)) {
            const raw = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
            const total = raw.total || {};
            statements = total.statements ? `${total.statements.pct}%` : 'n/a';
            branches = total.branches ? `${total.branches.pct}%` : 'n/a';
            functions = total.functions ? `${total.functions.pct}%` : 'n/a';
            lines = total.lines ? `${total.lines.pct}%` : 'n/a';
            coverage = 'found';
          }

          console.log('## Frontend Summary');
          console.log('');
          console.log('| Item | Value |');
          console.log('|------|-------|');
          console.log(`| Node.js | \`${process.env.NODE_VERSION}\` |`);
          console.log(`| Coverage summary | \`${coveragePath}\` ${coverage} |`);
          console.log(`| Statement coverage | \`${statements}\` |`);
          console.log(`| Branch coverage | \`${branches}\` |`);
          console.log(`| Function coverage | \`${functions}\` |`);
          console.log(`| Line coverage | \`${lines}\` |`);
          console.log(`| Build artifact | \`${nextPath}\` ${fs.existsSync(nextPath) ? 'found' : 'missing'} |`);
          console.log('');
          console.log('Executed:');
          console.log('- `npm run type-check`');
          console.log('- `npm run lint`');
          console.log('- `npm test -- --coverage --watchAll=false --passWithNoTests --maxWorkers=2`');
          console.log('- `npm run build`');
          NODE

  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    needs: [dependency-scanning, backend-tests, frontend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      NEXT_PUBLIC_API_BASE_URL: /api/backend
      BACKEND_API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_APP_BASE_URL: http://localhost:4000
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-google-client-id
      NEXT_PUBLIC_GOOGLE_REDIRECT_URI: http://localhost:4000/auth/google/callback
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required deployment secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          missing_backend=()
          for name in EC2_HOST EC2_USER EC2_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              missing_backend+=("$name")
            fi
          done

          if [ "${#missing_backend[@]}" -gt 0 ]; then
            echo "::error::Missing required backend deploy secrets: ${missing_backend[*]}"
            exit 1
          fi

      - name: Validate optional Vercel configuration
        run: |
          set -euo pipefail

          present=0
          for value in "${VERCEL_TOKEN}" "${VERCEL_ORG_ID}" "${VERCEL_PROJECT_ID}"; do
            if [ -n "$value" ]; then
              present=$((present + 1))
            fi
          done

          if [ "$present" -ne 0 ] && [ "$present" -ne 3 ]; then
            echo "::error::Vercel deploy secrets are partially configured. Set VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID together."
            exit 1
          fi

      - name: Generate version tag
        id: version
        run: echo "version=$(date +%Y%m%d)-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        id: build_backend_image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=min,scope=backend-image

      - name: Smoke test backend image
        id: smoke_test_backend_image
        run: |
          set -euo pipefail
          backend_image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ steps.version.outputs.version }}"
          echo "Validating backend image runtime: ${backend_image}"
          docker pull "${backend_image}"
          docker run --rm \
            -e ENVIRONMENT=test \
            "${backend_image}" \
            python -c "from pathlib import Path; import fastapi, uvicorn; import langgraph; from backend.api.main import app; dataset = Path('/app/backend/rag/tests/test_dataset.json'); assert dataset.exists(), f'missing evaluation dataset: {dataset}'; assert dataset.stat().st_size > 0, f'empty evaluation dataset: {dataset}'; print(f'backend image runtime import check passed: {app.title} | dataset={dataset}')"

      - name: Build & push frontend image
        id: build_frontend_image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
            BACKEND_API_BASE_URL=${{ env.BACKEND_API_BASE_URL }}
            NEXT_PUBLIC_APP_BASE_URL=${{ env.NEXT_PUBLIC_APP_BASE_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ env.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_GOOGLE_REDIRECT_URI=${{ env.NEXT_PUBLIC_GOOGLE_REDIRECT_URI }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=min,scope=frontend-image

      - name: Deploy frontend to Vercel
        id: vercel_deploy
        if: ${{ env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '' }}
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          deployment_url="$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" | tail -n 1 | perl -pe 's/\r$//')"
          if [ -z "$deployment_url" ]; then
            echo "::error::Vercel deploy did not return a deployment URL."
            exit 1
          fi

          vercel inspect "$deployment_url" --token="$VERCEL_TOKEN" >/tmp/vercel-inspect.txt
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Cleanup old Vercel production deployments
        if: ${{ steps.vercel_deploy.outputs.deployment_url != '' }}
        working-directory: frontend
        env:
          DEPLOYMENT_URL: ${{ steps.vercel_deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail

          deployments_json="$(vercel list --environment=production --status=READY --format json --token="$VERCEL_TOKEN")"
          deploy_count="$(echo "$deployments_json" | jq 'length')"
          if [ "$deploy_count" -le 1 ]; then
            echo "No old production deployments to remove."
            exit 0
          fi

          echo "Keeping active deployment: $DEPLOYMENT_URL"

          echo "$deployments_json" | jq -r '.[].url' | while read -r url; do
            if [ -n "$url" ] && [ "$url" != "$DEPLOYMENT_URL" ]; then
              echo "Removing old deployment: $url"
              vercel remove "$url" --yes --token="$VERCEL_TOKEN" || true
            fi
          done

      - name: Deploy backend to EC2
        id: deploy_backend
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          BACKEND_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ steps.version.outputs.version }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          envs: GHCR_TOKEN,ACTOR,BACKEND_IMAGE
          script: |
            set -euo pipefail

            command -v docker >/dev/null
            command -v curl >/dev/null

            retry_command() {
              local description="$1"
              local attempts="${2:-4}"
              local sleep_seconds="${3:-10}"
              shift 3

              local attempt=1
              until "$@"; do
                local exit_code=$?
                if [ "$attempt" -ge "$attempts" ]; then
                  echo "${description} failed after ${attempts} attempts"
                  return "$exit_code"
                fi

                echo "${description} failed on attempt ${attempt}/${attempts}; retrying in ${sleep_seconds}s..."
                attempt=$((attempt + 1))
                sleep "${sleep_seconds}"
              done
            }

            ghcr_preflight() {
              local status
              status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://ghcr.io/v2/ || true)"
              case "$status" in
                200|401|403|405)
                  return 0
                  ;;
                *)
                  echo "Unexpected GHCR preflight status: ${status:-unavailable}" >&2
                  return 1
                  ;;
              esac
            }

            docker_login_ghcr() {
              docker logout ghcr.io >/dev/null 2>&1 || true
              printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
            }

            docker_pull_backend_image() {
              docker pull "$BACKEND_IMAGE"
            }

            wait_for_backend_ready() {
              local name="$1"
              local url="$2"
              local container="$3"
              local attempts="${4:-60}"
              local sleep_seconds="${5:-5}"

              for i in $(seq 1 "${attempts}"); do
                if curl -sf "${url}" > /dev/null; then
                  echo "${name} healthy after $((i * sleep_seconds))s"
                  return 0
                fi

                if ! docker ps --format '{{.Names}}' | grep -qx "${container}"; then
                  echo "${name} container is no longer running"
                  docker ps -a --filter "name=${container}" || true
                  docker logs "${container}" --tail 200 || true
                  docker inspect "${container}" || true
                  return 1
                fi

                if [ $((i % 6)) -eq 0 ]; then
                  echo "=== ${name} still starting (${i}/${attempts}) ==="
                  docker logs "${container}" --tail 40 || true
                fi

                if [ "$i" -eq "${attempts}" ]; then
                  echo "${name} failed readiness check after $((attempts * sleep_seconds))s"
                  docker ps -a --filter "name=${container}" || true
                  docker logs "${container}" --tail 200 || true
                  docker inspect "${container}" || true
                  return 1
                fi

                echo "Attempt $i/${attempts}; retrying in ${sleep_seconds}s..."
                sleep "${sleep_seconds}"
              done
            }

            echo "=== Authenticating with GHCR ==="
            retry_command "GHCR reachability check" 4 10 ghcr_preflight
            retry_command "GHCR authentication" 4 15 docker_login_ghcr

            echo "=== Pulling image: $BACKEND_IMAGE ==="
            retry_command "Backend image pull" 4 15 docker_pull_backend_image

            echo "=== Starting candidate backend container on port 18010 ==="
            docker stop smart-tutor-backend-candidate 2>/dev/null || true
            docker rm smart-tutor-backend-candidate 2>/dev/null || true
            docker run -d \
              --name smart-tutor-backend-candidate \
              --restart unless-stopped \
              --network smart-tutor_smart-tutor-network \
              --env-file ~/smart-tutor.env \
              -p 18010:8000 \
              -v /home/ubuntu/smart-tutor-data/logs:/app/logs \
              -v /home/ubuntu/smart-tutor-data/user_data:/app/user_data \
              -v /home/ubuntu/smart-tutor-data/chroma_db:/app/chroma_db \
              "$BACKEND_IMAGE" \
              uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --workers 1

            echo "=== Waiting for candidate backend readiness ==="
            if ! wait_for_backend_ready \
              "Candidate backend" \
              "http://localhost:18010/ready" \
              "smart-tutor-backend-candidate" \
              60 \
              5; then
              docker rm -f smart-tutor-backend-candidate || true
              exit 1
            fi

            echo "=== Replacing production backend container ==="
            docker stop smart-tutor-backend 2>/dev/null || true
            docker rm smart-tutor-backend 2>/dev/null || true

            docker run -d \
              --name smart-tutor-backend \
              --restart unless-stopped \
              --network smart-tutor_smart-tutor-network \
              --env-file ~/smart-tutor.env \
              -p 8010:8000 \
              -v /home/ubuntu/smart-tutor-data/logs:/app/logs \
              -v /home/ubuntu/smart-tutor-data/user_data:/app/user_data \
              -v /home/ubuntu/smart-tutor-data/chroma_db:/app/chroma_db \
              "$BACKEND_IMAGE" \
              uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --workers 1

            echo "=== Waiting for production backend readiness ==="
            if ! wait_for_backend_ready \
              "Production backend" \
              "http://localhost:8010/ready" \
              "smart-tutor-backend" \
              60 \
              5; then
              exit 1
            fi

            echo "=== Cleaning up candidate container ==="
            docker rm -f smart-tutor-backend-candidate 2>/dev/null || true

            echo "=== Pruning all unused images/layers ==="
            docker image prune -af || true

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Build And Deploy Summary"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Workflow trigger | \`${{ github.event_name }}\` on \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Release version | \`${{ steps.version.outputs.version }}\` |"
            echo "| Backend image | \`ghcr.io/${{ env.IMAGE_NAME }}-backend:${{ steps.version.outputs.version }}\` |"
            echo "| Frontend image | \`ghcr.io/${{ env.IMAGE_NAME }}-frontend:${{ steps.version.outputs.version }}\` |"
            echo "| Backend candidate probe | \`http://localhost:18010/ready\` |"
            echo "| Backend production probe | \`http://localhost:8010/ready\` |"
            echo "| EC2 deploy target | \`${{ secrets.EC2_HOST != '' && 'configured' || 'missing' }}\` |"
            echo "| Backend image build | \`${{ steps.build_backend_image.outcome }}\` |"
            echo "| Backend smoke test | \`${{ steps.smoke_test_backend_image.outcome }}\` |"
            echo "| Frontend image build | \`${{ steps.build_frontend_image.outcome }}\` |"
            echo "| Backend deploy | \`${{ steps.deploy_backend.outcome }}\` |"
            if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
              echo "| Frontend deploy | \`${{ steps.vercel_deploy.outcome }}\` |"
              echo "| Vercel deployment | \`${{ steps.vercel_deploy.outputs.deployment_url }}\` |"
            else
              echo "| Frontend deploy | skipped: Vercel secrets not configured |"
            fi
            echo ""
            echo "Stages:"
            echo "- Backend image build and smoke test"
            echo "- Frontend image build"
            echo "- Optional Vercel production deploy"
            echo "- Backend EC2 rolling replacement via candidate container"
          } >> "$GITHUB_STEP_SUMMARY"

  gitops-promote:
    name: GitOps Promote
    runs-on: ubuntu-latest
    needs: [build-and-deploy]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor != 'github-actions[bot]' &&
      vars.ENABLE_GITOPS_PRODUCTION == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update production image tags
        env:
          VERSION: ${{ needs.build-and-deploy.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          version = os.environ["VERSION"]
          path = Path("helm/smart-ai-tutor/values-production.yaml")
          text = path.read_text()

          replacements = [
              (
                  r"(backend:\n(?:.*\n)*?\s+image:\n(?:.*\n)*?\s+tag:\s*)([^\n]+)",
                  rf"\1{version}",
              ),
              (
                  r"(frontend:\n(?:.*\n)*?\s+image:\n(?:.*\n)*?\s+tag:\s*)([^\n]+)",
                  rf"\1{version}",
              ),
          ]

          updated = text
          for pattern, replacement in replacements:
              updated, count = re.subn(pattern, replacement, updated, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"failed to update expected image tag block: {pattern}")

          path.write_text(updated)
          PY

      - name: Commit promoted release
        env:
          VERSION: ${{ needs.build-and-deploy.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet -- helm/smart-ai-tutor/values-production.yaml; then
            echo "No GitOps changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/smart-ai-tutor/values-production.yaml
          git commit -m "chore(gitops): promote production images to ${VERSION}"
          git push

      - name: Promotion summary
        env:
          VERSION: ${{ needs.build-and-deploy.outputs.version }}
        run: |
          {
            echo "## GitOps Promotion"
            echo ""
            echo "- Updated \`helm/smart-ai-tutor/values-production.yaml\` to image tag \`${VERSION}\`"
            echo "- ArgoCD will sync the promoted release from \`main\`"
          } >> "$GITHUB_STEP_SUMMARY"
