name: CI Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - helm/smart-ai-tutor/values-production.yaml
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20.9.0"
  REGISTRY: ghcr.io
  IMAGE_NAME: liteshperumalla/smart-tutor-ai-ai-driven-personalized-teaching-support
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@v3.88.0
        if: >-
          github.event_name == 'pull_request' ||
          (github.event.before != github.sha &&
           github.event.before != '0000000000000000000000000000000000000000')
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  dependency-scanning:
    name: Dependency Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [secret-scanning]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Python safety check
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "safety<4"
          touch safety-report.json
          safety check --file=backend/requirements.txt --json --output safety-report.json || true

      - name: npm audit (frontend)
        run: |
          set -euo pipefail
          cd frontend
          npm ci --legacy-peer-deps
          npm audit --audit-level=critical

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: safety-report.json
          if-no-files-found: warn
          retention-days: 30

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    needs: [secret-scanning]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run tests
        env:
          ENVIRONMENT: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          PYTHONPATH: .
        run: |
          set -euo pipefail
          pytest backend/tests/ -v \
            --cov=backend \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=backend/junit.xml \
            --maxfail=5

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: backend/junit.xml
          check_name: Backend Test Results

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: ${{ vars.ENABLE_CODECOV == 'true' }}
        with:
          file: ./coverage.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Backend summary
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import xml.etree.ElementTree as ET

          junit_path = Path("backend/junit.xml")
          coverage_path = Path("coverage.xml")

          tests = failures = errors = skipped = 0
          if junit_path.exists():
              root = ET.parse(junit_path).getroot()
              if root.tag == "testsuites":
                  tests = int(root.attrib.get("tests", 0))
                  failures = int(root.attrib.get("failures", 0))
                  errors = int(root.attrib.get("errors", 0))
                  skipped = int(root.attrib.get("skipped", 0))
              else:
                  tests = int(root.attrib.get("tests", 0))
                  failures = int(root.attrib.get("failures", 0))
                  errors = int(root.attrib.get("errors", 0))
                  skipped = int(root.attrib.get("skipped", 0))

          coverage_pct = "n/a"
          if coverage_path.exists():
              root = ET.parse(coverage_path).getroot()
              line_rate = root.attrib.get("line-rate")
              if line_rate is not None:
                  coverage_pct = f"{float(line_rate) * 100:.2f}%"

          print("## Backend Summary")
          print()
          print("| Item | Value |")
          print("|------|-------|")
          print("| Python | `${{ env.PYTHON_VERSION }}` |")
          print(f"| Test report | `{junit_path}` {'found' if junit_path.exists() else 'missing'} |")
          print(f"| Tests | `{tests}` |")
          print(f"| Failures | `{failures}` |")
          print(f"| Errors | `{errors}` |")
          print(f"| Skipped | `{skipped}` |")
          print(f"| Coverage XML | `{coverage_path}` {'found' if coverage_path.exists() else 'missing'} |")
          print(f"| Line coverage | `{coverage_pct}` |")
          print()
          print("Executed:")
          print("- `pytest backend/tests/ -v --cov=backend --cov-report=xml --cov-report=term-missing --junitxml=backend/junit.xml --maxfail=5`")
          PY

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [secret-scanning]
    env:
      NEXT_PUBLIC_API_BASE_URL: /api/backend
      BACKEND_API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_APP_BASE_URL: http://localhost:4000
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-google-client-id
      NEXT_PUBLIC_GOOGLE_REDIRECT_URI: http://localhost:4000/auth/google/callback
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          set -euo pipefail
          cd frontend
          npm ci --legacy-peer-deps

      - name: TypeScript type check
        run: |
          set -euo pipefail
          cd frontend
          npm run type-check

      - name: Lint
        run: |
          set -euo pipefail
          cd frontend
          npm run lint

      - name: Unit tests
        run: |
          set -euo pipefail
          cd frontend
          npm test -- --coverage --watchAll=false --passWithNoTests --maxWorkers=2

      - name: Build
        run: |
          set -euo pipefail
          cd frontend
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Frontend summary
        if: always()
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const path = require('path');

          const coveragePath = path.join('frontend', 'coverage', 'coverage-summary.json');
          const nextPath = path.join('frontend', '.next');
          let coverage = 'n/a';
          let statements = 'n/a';
          let branches = 'n/a';
          let functions = 'n/a';
          let lines = 'n/a';

          if (fs.existsSync(coveragePath)) {
            const raw = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
            const total = raw.total || {};
            statements = total.statements ? `${total.statements.pct}%` : 'n/a';
            branches = total.branches ? `${total.branches.pct}%` : 'n/a';
            functions = total.functions ? `${total.functions.pct}%` : 'n/a';
            lines = total.lines ? `${total.lines.pct}%` : 'n/a';
            coverage = 'found';
          }

          console.log('## Frontend Summary');
          console.log('');
          console.log('| Item | Value |');
          console.log('|------|-------|');
          console.log(`| Node.js | \`${process.env.NODE_VERSION}\` |`);
          console.log(`| Coverage summary | \`${coveragePath}\` ${coverage} |`);
          console.log(`| Statement coverage | \`${statements}\` |`);
          console.log(`| Branch coverage | \`${branches}\` |`);
          console.log(`| Function coverage | \`${functions}\` |`);
          console.log(`| Line coverage | \`${lines}\` |`);
          console.log(`| Build artifact | \`${nextPath}\` ${fs.existsSync(nextPath) ? 'found' : 'missing'} |`);
          console.log('');
          console.log('Executed:');
          console.log('- `npm run type-check`');
          console.log('- `npm run lint`');
          console.log('- `npm test -- --coverage --watchAll=false --passWithNoTests --maxWorkers=2`');
          console.log('- `npm run build`');
          NODE
