name: Synthetic Production Monitor

on:
  schedule:
    # Fires every 5 minutes; scheduled runs only probe production while the
    # EC2 instance is up (see "Check EC2 business-hours window" below).
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to probe"
        required: false
        default: production
        type: choice
        options:
          - production
          - staging

concurrency:
  group: synthetic-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  synthetic-probes:
    name: Synthetic Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check EC2 business-hours window
        id: window
        # ec2-schedule.yml stops the production instance outside Mon-Fri
        # 09:00-17:00 America/Chicago, so off-hours probes always fail with
        # "connection refused" and page Slack for an intentional shutdown.
        # Scheduled runs skip outside that window, with a 30-minute grace
        # after start (the 15-min reconciler can fire late) and 15 minutes
        # before stop. Manual dispatches always probe.
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DOW="$(TZ='America/Chicago' date +%u)"
          MINUTE_OF_DAY=$(( 10#$(TZ='America/Chicago' date +%H) * 60 + 10#$(TZ='America/Chicago' date +%M) ))
          echo "Central time: $(TZ='America/Chicago' date '+%A %H:%M %Z')"
          if [ "$DOW" -le 5 ] && [ "$MINUTE_OF_DAY" -ge $(( 9 * 60 + 30 )) ] && [ "$MINUTE_OF_DAY" -lt $(( 17 * 60 - 15 )) ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "Outside EC2 business hours — production is intentionally stopped; skipping probes."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.window.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Select target environment URLs
        if: steps.window.outputs.skip != 'true'
        id: target
        env:
          TARGET_ENV: ${{ inputs.environment || 'production' }}
          STAGING_API_URL: ${{ secrets.STAGING_API_URL || vars.STAGING_API_URL }}
          STAGING_APP_URL: ${{ secrets.STAGING_APP_URL || vars.STAGING_APP_URL }}
          PROD_API_URL: ${{ secrets.PRODUCTION_API_URL || vars.PRODUCTION_API_URL }}
          PROD_APP_URL: ${{ secrets.PRODUCTION_APP_URL || vars.PRODUCTION_APP_URL }}
        run: |
          echo "Selected target environment: $TARGET_ENV"
          if [ "$TARGET_ENV" = "staging" ]; then
            api_url="$STAGING_API_URL"
            app_url="$STAGING_APP_URL"
            if [ -z "$api_url" ] && [ -z "$app_url" ]; then
              echo "::warning::No staging URLs configured (STAGING_API_URL / STAGING_APP_URL)."
            fi
          else
            api_url="$PROD_API_URL"
            app_url="$PROD_APP_URL"
          fi
          clean_api_url="$(printf '%s' "$api_url" | tr -d '\r\n')"
          clean_app_url="$(printf '%s' "$app_url" | tr -d '\r\n')"
          printf 'api_url=%s\n' "$clean_api_url" >> "$GITHUB_OUTPUT"
          printf 'app_url=%s\n' "$clean_app_url" >> "$GITHUB_OUTPUT"

      - name: Make synthetic monitor executable
        if: steps.window.outputs.skip != 'true'
        run: chmod +x scripts/synthetic-monitor.sh

      - name: Run synthetic probes
        if: steps.window.outputs.skip != 'true'
        id: probes
        env:
          PRODUCTION_API_URL: ${{ steps.target.outputs.api_url }}
          PRODUCTION_APP_URL: ${{ steps.target.outputs.app_url }}
          SYNTHETIC_TEST_USERNAME: ${{ secrets.SYNTHETIC_TEST_USERNAME }}
          SYNTHETIC_TEST_PASSWORD: ${{ secrets.SYNTHETIC_TEST_PASSWORD }}
          SYNTHETIC_ADMIN_TOKEN: ${{ secrets.SYNTHETIC_ADMIN_TOKEN }}
          ALERTMANAGER_SLACK_WEBHOOK_URL: ${{ secrets.ALERTMANAGER_SLACK_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL_SMART_TUTOR_AI || secrets.SLACK_WEBHOOK_URL_APP_DEV_ANALYTICS }}
          SLACK_WEBHOOK_URL_SMART_TUTOR_AI: ${{ secrets.SLACK_WEBHOOK_URL_SMART_TUTOR_AI }}
          SLACK_WEBHOOK_URL_APP_DEV_ANALYTICS: ${{ secrets.SLACK_WEBHOOK_URL_APP_DEV_ANALYTICS }}
          WORKFLOW_TRIGGER: ${{ github.event_name }}
        run: ./scripts/synthetic-monitor.sh

      - name: Report failure to Slack
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.ALERTMANAGER_SLACK_WEBHOOK_URL || secrets.SLACK_WEBHOOK_URL_SMART_TUTOR_AI || secrets.SLACK_WEBHOOK_URL_APP_DEV_ANALYTICS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -s -X POST "$SLACK_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d "{\"text\": \"🚨 *Synthetic Monitor* FAILED — <$RUN_URL|View Run>\"}"
          fi

      - name: Probe Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          TARGET_ENV: ${{ inputs.environment || 'production' }}
          SKIPPED: ${{ steps.window.outputs.skip }}
        run: |
          if [ "$SKIPPED" = "true" ]; then JOB_STATUS="skipped (EC2 off-hours)"; fi
          {
            echo "## Synthetic Monitor Run"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Status | \`$JOB_STATUS\` |"
            echo "| Target Environment | \`$TARGET_ENV\` |"
            echo "| Run time | \`$(date -u '+%Y-%m-%dT%H:%M:%SZ')\` |"
          } >> "$GITHUB_STEP_SUMMARY"
