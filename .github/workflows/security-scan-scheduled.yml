name: Scheduled Security Scans

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20.9.0"
  IMAGE_NAME: liteshperumalla/smart-tutor-ai-ai-driven-personalized-teaching-support

permissions:
  contents: read
  packages: read
  security-events: write
  issues: read

jobs:
  trivy-scheduled-scan:
    name: Trivy Full Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        # Trivy Action now publishes versioned tags with a required `v` prefix.
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: "0"

  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python (Backend)
        if: matrix.component == 'backend'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Run pip-audit (Backend)
        if: matrix.component == 'backend'
        id: pip-audit
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pip-audit
          : > pip-audit.json
          pip_audit_exit=0
          pip-audit --requirement backend/requirements.txt --format json --output pip-audit.json || pip_audit_exit=$?
          if [ ! -s pip-audit.json ] && [ "$pip_audit_exit" -ne 0 ]; then
            echo "::error::pip-audit failed before producing a report."
            exit "$pip_audit_exit"
          fi
          if jq -e 'length > 0' pip-audit.json >/dev/null; then
            echo "vulns_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "vulns_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js (Frontend)
        if: matrix.component == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run npm audit (Frontend)
        if: matrix.component == 'frontend'
        id: npm-audit
        run: |
          set -euo pipefail
          cd frontend
          npm ci --legacy-peer-deps
          npm audit --json > npm-audit-report.json || true

          if [ ! -s npm-audit-report.json ]; then
            echo "::error::npm audit did not produce a report."
            exit 1
          fi

          high_and_critical_count="$(jq '.metadata.vulnerabilities.high + .metadata.vulnerabilities.critical' npm-audit-report.json)"
          if [ "${high_and_critical_count}" -gt 0 ]; then
            echo "vulns_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "vulns_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ matrix.component }}
          path: |
            pip-audit.json
            frontend/npm-audit-report.json
          if-no-files-found: warn
          retention-days: 90

      - name: Create issue if vulnerabilities found
        if: >-
          ${{ vars.CREATE_SECURITY_ISSUES == 'true' && (
            (matrix.component == 'backend' && steps.pip-audit.outputs.vulns_found == 'true') ||
            (matrix.component == 'frontend' && steps.npm-audit.outputs.vulns_found == 'true')
          ) }}
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Security vulnerabilities detected in ${{ matrix.component }}`,
              body: `Automated security scan detected vulnerabilities in ${{ matrix.component }}.\n\nPlease review the artifacts from workflow run #${{ github.run_number }}.`,
              labels: ['security', 'dependencies', 'automated']
            })

  container-scan:
    name: Container Security Scan (Latest)
    runs-on: ubuntu-latest
    if: github.ref_name == github.event.repository.default_branch
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest backend image
        id: pull-backend
        run: |
          set -euo pipefail
          if docker pull ghcr.io/${{ env.IMAGE_NAME }}-backend:latest; then
            echo "pulled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Backend latest image not found in GHCR; skipping backend image scan."
            echo "pulled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan backend image
        if: steps.pull-backend.outputs.pulled == 'true'
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAME }}-backend:latest
          format: sarif
          output: trivy-backend.sarif

      - name: Upload backend scan results
        if: steps.pull-backend.outputs.pulled == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend-latest

      - name: Pull latest frontend image
        id: pull-frontend
        run: |
          set -euo pipefail
          if docker pull ghcr.io/${{ env.IMAGE_NAME }}-frontend:latest; then
            echo "pulled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Frontend latest image not found in GHCR; skipping frontend image scan."
            echo "pulled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan frontend image
        if: steps.pull-frontend.outputs.pulled == 'true'
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ghcr.io/${{ env.IMAGE_NAME }}-frontend:latest
          format: sarif
          output: trivy-frontend.sarif

      - name: Upload frontend scan results
        if: steps.pull-frontend.outputs.pulled == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend-latest

  license-compliance:
    name: License Compliance Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check Python licenses
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pip-licenses
          pip install -r backend/requirements.txt
          pip-licenses --format=json --output-file=python-licenses.json
          pip-licenses --fail-on='GPL;AGPL'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check npm licenses
        run: |
          set -euo pipefail
          cd frontend
          npm ci --legacy-peer-deps
          npx license-checker --json --out ../npm-licenses.json
          npx license-checker --failOn 'GPL;AGPL'

      - name: Upload license reports
        uses: actions/upload-artifact@v4
        with:
          name: license-reports
          path: |
            python-licenses.json
            npm-licenses.json
          if-no-files-found: warn
          retention-days: 90

  sbom-generation:
    name: Generate Software Bill of Materials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom-spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom-spdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Scan SBOM with Grype
        uses: anchore/scan-action@v3
        with:
          sbom: sbom-spdx.json
          fail-build: false

  security-scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.3.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

  notify-security-scan:
    name: Notify Security Scan Result
    runs-on: ubuntu-latest
    needs: [trivy-scheduled-scan, dependency-audit, container-scan, license-compliance, sbom-generation, security-scorecard]
    if: always()
    permissions:
      contents: read
    env:
      SCAN_RESULT: ${{ needs.trivy-scheduled-scan.result }}
      DEP_RESULT: ${{ needs.dependency-audit.result }}
      CONTAINER_RESULT: ${{ needs.container-scan.result }}
      LICENSE_RESULT: ${{ needs.license-compliance.result }}
      SBOM_RESULT: ${{ needs.sbom-generation.result }}
      SCORECARD_RESULT: ${{ needs.security-scorecard.result }}
    steps:
      - name: Compute overall status
        id: status
        run: |
          set -euo pipefail
          overall="success"
          if [ "${SCAN_RESULT}" = "failure" ] || [ "${DEP_RESULT}" = "failure" ] || [ "${CONTAINER_RESULT}" = "failure" ]; then
            overall="failure"
          elif [ "${LICENSE_RESULT}" = "failure" ] || [ "${SBOM_RESULT}" = "failure" ]; then
            overall="warning"
          fi
          echo "overall=${overall}" >> "$GITHUB_OUTPUT"

      - name: Checkout for Slack notify
        uses: actions/checkout@v4

      - name: Notify #smart-tutor-ai
        uses: ./.github/actions/send-slack-notification
        with:
          channel: SMART_TUTOR_AI
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL_SMART_TUTOR_AI }}
          workflow_name: Scheduled Security Scan
          status: ${{ steps.status.outputs.overall }}
          verbiage: Security Scan
          message: |
            ${{ steps.status.outputs.overall == 'failure' && ':rotating_light: *Security scan FAILED* — critical issues detected' || steps.status.outputs.overall == 'warning' && ':warning: *Security scan completed with non-critical findings*' || ':white_check_mark: *Security scan PASSED* — no critical issues' }}
            Daily automated scan of codebase, containers, dependencies, and licenses.
          fields: >-
            [
              {"title": "Trivy Scan", "value": "${{ needs.trivy-scheduled-scan.result }}", "short": true},
              {"title": "Dependency Audit", "value": "${{ needs.dependency-audit.result }}", "short": true},
              {"title": "Container Scan", "value": "${{ needs.container-scan.result }}", "short": true},
              {"title": "License Compliance", "value": "${{ needs.license-compliance.result }}", "short": true},
              {"title": "SBOM", "value": "${{ needs.sbom-generation.result }}", "short": true},
              {"title": "Scorecard", "value": "${{ needs.security-scorecard.result }}", "short": true}
            ]

      - name: Notify #app-development-analytics
        uses: ./.github/actions/send-slack-notification
        with:
          channel: APP_DEV_ANALYTICS
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL_APP_DEV_ANALYTICS }}
          workflow_name: Scheduled Security Scan
          status: ${{ steps.status.outputs.overall }}
          verbiage: Security Scan
          message: |
            ${{ steps.status.outputs.overall == 'failure' && ':rotating_light: *Security scan FAILED* — critical issues detected' || steps.status.outputs.overall == 'warning' && ':warning: *Security scan completed with non-critical findings*' || ':white_check_mark: *Security scan PASSED* — all checks passed' }}
            Daily security scan results — Trivy, dependency audit, container image scan, license compliance, SBOM, and OpenSSF scorecard.
          fields: >-
            [
              {"title": "Trivy Scan", "value": "${{ needs.trivy-scheduled-scan.result }}", "short": true},
              {"title": "Dependency Audit", "value": "${{ needs.dependency-audit.result }}", "short": true},
              {"title": "Container Scan", "value": "${{ needs.container-scan.result }}", "short": true},
              {"title": "License Compliance", "value": "${{ needs.license-compliance.result }}", "short": true},
              {"title": "SBOM", "value": "${{ needs.sbom-generation.result }}", "short": true},
              {"title": "Scorecard", "value": "${{ needs.security-scorecard.result }}", "short": true}
            ]
