      SLACK_WEBHOOK_URL_APP_DEV_ANALYTICS: ${{ secrets.SLACK_WEBHOOK_URL_APP_DEV_ANALYTICS }}
    with:
      channel: APP_DEV_ANALYTICS
      workflow_name: Production Deploy
      status: ${{ needs.build-and-deploy.result == 'failure' && 'failure' || 'success' }}
      verbiage: Deploy
      message: |
        ${{ needs.build-and-deploy.result == 'failure' && ':x: *Production deploy FAILED*' || ':white_check_mark: *Production deploy SUCCEEDED*' }}
        Deployment completed and promoted via GitOps.
      fields: >-
        [
          {"title": "Version", "value": "${{ needs.build-and-deploy.outputs.version || 'n/a' }}", "short": true},
          {"title": "Deploy Ref", "value": "${{ needs.build-and-deploy.outputs.deploy_ref || 'n/a' }}", "short": true},
          {"title": "Trigger", "value": "${{ github.event_name }}", "short": true},
          {"title": "Result", "value": "${{ needs.build-and-deploy.result }}", "short": true}
        ]
