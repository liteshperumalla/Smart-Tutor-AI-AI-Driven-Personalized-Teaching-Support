name: Staging Deploy

# Staging runs as separate containers on the production EC2 instance
# (smart-tutor-staging-backend on port 8110, own data dir, CPU/RAM capped).
# Deploy a PR by adding the "deploy:staging" label; new pushes to a labelled
# PR redeploy it, and removing the label or closing the PR tears staging down.
on:
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened, closed]
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch, tag or SHA to deploy to staging
        required: true
        default: main

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20.20.2"
  REGISTRY: ghcr.io
  IMAGE_NAME: liteshperumalla/smart-tutor-ai-ai-driven-personalized-teaching-support
  # Same instance as production; the "staging" environment can override any
  # of these if a dedicated staging host is added later. The AWS and EC2
  # secrets are set per job (below), not here, so they stay scoped to the
  # jobs that use them.
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  EC2_INSTANCE_NAME: ${{ vars.EC2_INSTANCE_NAME || '' }}
  EC2_AUTO_START: ${{ vars.EC2_AUTO_START || 'true' }}
  EC2_TEMPORARY_SSH_INGRESS: ${{ vars.EC2_TEMPORARY_SSH_INGRESS || 'true' }}

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'develop') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       ((github.event.action == 'labeled' && github.event.label.name == 'deploy:staging') ||
        ((github.event.action == 'synchronize' || github.event.action == 'reopened') &&
         contains(github.event.pull_request.labels.*.name, 'deploy:staging'))))
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      NEXT_PUBLIC_API_BASE_URL: /api/backend
      BACKEND_API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_APP_BASE_URL: ${{ secrets.STAGING_APP_URL }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      NEXT_PUBLIC_GOOGLE_REDIRECT_URI: ${{ secrets.STAGING_GOOGLE_OAUTH_REDIRECT_URI }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || '' }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || '' }}
      EC2_HOST: ${{ secrets.EC2_HOST || '' }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID || '' }}
    steps:
      - name: Resolve deployment target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_GIT_REF: ${{ inputs.git_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          case "${EVENT_NAME}" in
            workflow_run)
              checkout_ref="${WORKFLOW_HEAD_SHA}"
              deploy_ref="develop"
              ;;
            pull_request)
              checkout_ref="${PR_HEAD_SHA}"
              deploy_ref="PR #${PR_NUMBER} (${PR_HEAD_REF})"
              ;;
            *)
              checkout_ref="${INPUT_GIT_REF}"
              deploy_ref="${INPUT_GIT_REF}"
              ;;
          esac

          echo "checkout_ref=${checkout_ref}" >> "$GITHUB_OUTPUT"
          echo "deploy_ref=${deploy_ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.checkout_ref }}
          fetch-depth: 1

      - name: Validate required staging secrets
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          missing=()
          for name in EC2_USER EC2_SSH_KEY NEXT_PUBLIC_APP_BASE_URL NEXT_PUBLIC_GOOGLE_CLIENT_ID NEXT_PUBLIC_GOOGLE_REDIRECT_URI; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ -z "${EC2_HOST:-}" ] && [ -z "${EC2_INSTANCE_ID:-}" ] && [ -z "${EC2_INSTANCE_NAME:-}" ]; then
            missing+=("EC2_HOST or EC2_INSTANCE_ID/EC2_INSTANCE_NAME")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required staging deployment secrets: ${missing[*]}"
            exit 1
          fi

          for url_name in NEXT_PUBLIC_APP_BASE_URL NEXT_PUBLIC_GOOGLE_REDIRECT_URI; do
            case "${!url_name}" in
              https://*) ;;
              *)
                echo "::error::${url_name} must be an HTTPS public URL."
                exit 1
                ;;
            esac
          done

          if [ "${NEXT_PUBLIC_GOOGLE_CLIENT_ID}" = "ci-google-client-id" ]; then
            echo "::error::Staging builds must not use placeholder Google OAuth configuration."
            exit 1
          fi

      - name: Install AWS CLI
        if: ${{ env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' }}
        uses: unfor19/install-aws-cli-action@e8b481e524a99f37fbd39fdc1dcb3341ab091367  # v1.0.7

      - name: Resolve EC2 target (shared with production)
        id: ec2-target
        run: scripts/ci/resolve_ec2_target.sh

      - name: Generate version tag
        id: version
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=7 HEAD)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "version=staging-$(date +%Y%m%d)-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        id: build_backend_image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:staging-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=min,scope=backend-image

      - name: Smoke test backend image
        id: smoke_test_backend_image
        run: |
          set -euo pipefail
          backend_image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ steps.version.outputs.version }}"
          echo "Validating backend image runtime: ${backend_image}"
          docker pull "${backend_image}"
          docker run --rm \
            -e ENVIRONMENT=staging \
            "${backend_image}" \
            python -c "from pathlib import Path; import fastapi, uvicorn; import langgraph; from backend.api.main import app; dataset = Path('/app/backend/rag/tests/test_dataset.json'); assert dataset.exists(), f'missing evaluation dataset: {dataset}'; assert dataset.stat().st_size > 0, f'empty evaluation dataset: {dataset}'; print(f'backend image runtime import check passed: {app.title} | dataset={dataset}')"

      - name: Export backend image bundle
        id: export_backend_image
        run: |
          set -euo pipefail
          backend_image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ steps.version.outputs.version }}"
          archive_path="${RUNNER_TEMP}/backend-image-${{ steps.version.outputs.version }}.tar.gz"

          docker save "${backend_image}" | gzip -1 > "${archive_path}"
          ls -lh "${archive_path}"

          echo "archive_path=${archive_path}" >> "$GITHUB_OUTPUT"
          echo "archive_name=$(basename "${archive_path}")" >> "$GITHUB_OUTPUT"

      - name: Build & push frontend image
        id: build_frontend_image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
            BACKEND_API_BASE_URL=${{ env.BACKEND_API_BASE_URL }}
            NEXT_PUBLIC_APP_BASE_URL=${{ env.NEXT_PUBLIC_APP_BASE_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ env.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_GOOGLE_REDIRECT_URI=${{ env.NEXT_PUBLIC_GOOGLE_REDIRECT_URI }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:staging-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=min,scope=frontend-image

      - name: Transfer backend image bundle to staging EC2
        id: transfer_backend_image
        env:
          EC2_HOST: ${{ steps.ec2-target.outputs.host }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          ARCHIVE_PATH: ${{ steps.export_backend_image.outputs.archive_path }}
          ARCHIVE_NAME: ${{ steps.export_backend_image.outputs.archive_name }}
        run: |
          set -euo pipefail

          key_file="$(mktemp)"
          printf '%s\n' "${EC2_SSH_KEY}" > "${key_file}"
          chmod 600 "${key_file}"

          # Distinct name so it can't collide with a production bundle in /tmp.
          remote_archive="/tmp/staging-${ARCHIVE_NAME}"
          ssh_opts=(-o StrictHostKeyChecking=no -o LogLevel=ERROR -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=2 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes)

          ssh_ok=false
          for attempt in 1 2 3; do
            if ssh "${ssh_opts[@]}" -i "${key_file}" "${EC2_USER}@${EC2_HOST}" "printf 'ssh-ok\n'"; then
              ssh_ok=true
              break
            fi
            echo "SSH attempt ${attempt}/3 failed; re-verifying EC2 state and ingress..."
            scripts/ci/resolve_ec2_target.sh || true
            sleep 5
          done
          if [ "${ssh_ok}" != "true" ]; then
            echo "::error::Unable to reach the EC2 host over SSH."
            exit 1
          fi

          # Only clear staging leftovers: production may be mid-deploy on this host.
          ssh "${ssh_opts[@]}" -i "${key_file}" "${EC2_USER}@${EC2_HOST}" \
            "rm -f /tmp/staging-backend-image-*.tar.gz 2>/dev/null || true; df -h / /tmp || true"

          scp "${ssh_opts[@]}" -i "${key_file}" "${ARCHIVE_PATH}" "${EC2_USER}@${EC2_HOST}:${remote_archive}"

          ssh "${ssh_opts[@]}" -i "${key_file}" "${EC2_USER}@${EC2_HOST}" \
            "set -euo pipefail; test -f '${remote_archive}'; ls -lh '${remote_archive}'"

          rm -f "${key_file}"

      - name: Deploy backend to staging EC2
        id: deploy_backend
        uses: appleboy/ssh-action@v1.0.3
        env:
          BACKEND_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ steps.version.outputs.version }}
          BACKEND_IMAGE_ARCHIVE: /tmp/staging-${{ steps.export_backend_image.outputs.archive_name }}
          STAGING_MEMORY_LIMIT: ${{ vars.STAGING_MEMORY_LIMIT || '1g' }}
          STAGING_CPU_LIMIT: ${{ vars.STAGING_CPU_LIMIT || '1.0' }}
        with:
          host: ${{ steps.ec2-target.outputs.host }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 75m
          envs: BACKEND_IMAGE,BACKEND_IMAGE_ARCHIVE,STAGING_MEMORY_LIMIT,STAGING_CPU_LIMIT
          script: |
            set -euo pipefail

            command -v docker >/dev/null
            command -v curl >/dev/null
            command -v gzip >/dev/null

            STAGING_ENV_FILE="${STAGING_ENV_FILE:-$HOME/smart-tutor-staging.env}"
            STAGING_BACKEND_CONTAINER="smart-tutor-staging-backend"
            STAGING_CANDIDATE_CONTAINER="smart-tutor-staging-backend-candidate"
            STAGING_BACKEND_PORT="8110"
            # Never mount production's data dirs: staging must not touch prod users or indexes.
            STAGING_DATA_DIR="/home/ubuntu/smart-tutor-staging-data"
            mkdir -p "${STAGING_DATA_DIR}/logs" "${STAGING_DATA_DIR}/user_data" "${STAGING_DATA_DIR}/chroma_db"
            # Cap staging so it can't starve the production containers it shares the host with.
            STAGING_LIMITS=(--memory "${STAGING_MEMORY_LIMIT:-1g}" --cpus "${STAGING_CPU_LIMIT:-1.0}")

            if [ ! -f "${STAGING_ENV_FILE}" ]; then
              echo "::error::Missing ${STAGING_ENV_FILE} on the host. Create it with staging-only settings (separate DB/Redis/S3 prefixes, ENVIRONMENT=staging); do not copy the production env file."
              exit 1
            fi

            docker_with_timeout() {
              local seconds="$1"
              shift

              if command -v timeout >/dev/null 2>&1; then
                timeout --signal=TERM "${seconds}" "$@"
                return $?
              fi

              "$@"
            }

            docker_prepare_for_load() {
              echo "=== Docker disk usage before load ==="
              df -h / /tmp || true
              docker system df || true

              docker rm -f "${STAGING_CANDIDATE_CONTAINER}" 2>/dev/null || true
              docker stop "${STAGING_BACKEND_CONTAINER}" 2>/dev/null || true
              docker rm "${STAGING_BACKEND_CONTAINER}" 2>/dev/null || true

              echo "=== Pruning dangling Docker data before load ==="
              docker image prune -f || true
            }

            docker_load_backend_image() {
              docker_prepare_for_load
              test -f "$BACKEND_IMAGE_ARCHIVE"

              if docker_with_timeout 30m bash -lc 'gzip -dc "$BACKEND_IMAGE_ARCHIVE" | docker load'; then
                echo "=== Removing backend image archive after successful load ==="
                rm -f "$BACKEND_IMAGE_ARCHIVE" 2>/dev/null || true
                echo "=== Docker disk usage after load ==="
                df -h / /tmp || true
                docker system df || true
                return 0
              else
                local exit_code=$?
                echo "docker load failed with exit code ${exit_code}" >&2
                echo "=== Docker disk usage after failed load ==="
                df -h / /tmp || true
                docker system df || true
                return "$exit_code"
              fi
            }

            get_container_health() {
              docker_with_timeout 5s docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
                "$1" 2>/dev/null || true
            }

            probe_backend_container() {
              local container="$1"
              local health_status

              health_status="$(get_container_health "${container}")"
              if [ "${health_status}" = "healthy" ]; then
                return 0
              fi

              docker_with_timeout 5s docker exec "${container}" \
                curl -sf --connect-timeout 1 --max-time 2 \
                http://127.0.0.1:8000/ready >/dev/null
            }

            wait_for_backend_ready() {
              local name="$1"
              local container="$2"
              local attempts="${3:-60}"
              local sleep_seconds="${4:-5}"

              for i in $(seq 1 "${attempts}"); do
                if probe_backend_container "${container}"; then
                  echo "${name} healthy after $((i * sleep_seconds))s"
                  return 0
                fi

                if ! docker ps --format '{{.Names}}' | grep -qx "${container}"; then
                  echo "${name} container is no longer running"
                  docker ps -a --filter "name=${container}" || true
                  docker logs "${container}" --tail 200 || true
                  docker inspect "${container}" || true
                  return 1
                fi

                if [ $((i % 6)) -eq 0 ]; then
                  echo "=== ${name} still starting (${i}/${attempts}) ==="
                  echo "Health status: $(get_container_health "${container}")"
                  docker logs "${container}" --tail 40 || true
                fi

                if [ "$i" -eq "${attempts}" ]; then
                  echo "${name} failed readiness check after $((attempts * sleep_seconds))s"
                  echo "Final health status: $(get_container_health "${container}")"
                  docker ps -a --filter "name=${container}" || true
                  docker logs "${container}" --tail 200 || true
                  docker inspect "${container}" || true
                  return 1
                fi

                echo "Attempt $i/${attempts}; retrying in ${sleep_seconds}s..."
                sleep "${sleep_seconds}"
              done
            }

            echo "=== Loading backend image bundle: $BACKEND_IMAGE_ARCHIVE ==="
            docker_load_backend_image
            docker image inspect "$BACKEND_IMAGE" >/dev/null

            echo "=== Starting candidate staging backend container ==="
            docker stop "${STAGING_CANDIDATE_CONTAINER}" 2>/dev/null || true
            docker rm "${STAGING_CANDIDATE_CONTAINER}" 2>/dev/null || true
            docker run -d \
              --name "${STAGING_CANDIDATE_CONTAINER}" \
              --restart unless-stopped \
              --network smart-tutor_smart-tutor-network \
              --env-file "${STAGING_ENV_FILE}" \
              --health-cmd 'curl -sf http://127.0.0.1:8000/ready >/dev/null || exit 1' \
              --health-interval 5s \
              --health-timeout 3s \
              --health-start-period 10s \
              --health-retries 3 \
              "${STAGING_LIMITS[@]}" \
              -v "${STAGING_DATA_DIR}/logs:/app/logs" \
              -v "${STAGING_DATA_DIR}/user_data:/app/user_data" \
              -v "${STAGING_DATA_DIR}/chroma_db:/app/chroma_db" \
              "$BACKEND_IMAGE" \
              uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --workers 1

            echo "=== Waiting for candidate staging backend readiness ==="
            if ! wait_for_backend_ready "Candidate staging backend" "${STAGING_CANDIDATE_CONTAINER}" 60 5; then
              docker rm -f "${STAGING_CANDIDATE_CONTAINER}" || true
              exit 1
            fi

            echo "=== Replacing staging backend container ==="
            docker stop "${STAGING_BACKEND_CONTAINER}" 2>/dev/null || true
            docker rm "${STAGING_BACKEND_CONTAINER}" 2>/dev/null || true

            docker run -d \
              --name "${STAGING_BACKEND_CONTAINER}" \
              --restart unless-stopped \
              --network smart-tutor_smart-tutor-network \
              --env-file "${STAGING_ENV_FILE}" \
              --health-cmd 'curl -sf http://127.0.0.1:8000/ready >/dev/null || exit 1' \
              --health-interval 5s \
              --health-timeout 3s \
              --health-start-period 10s \
              --health-retries 3 \
              -p "${STAGING_BACKEND_PORT}:8000" \
              "${STAGING_LIMITS[@]}" \
              -v "${STAGING_DATA_DIR}/logs:/app/logs" \
              -v "${STAGING_DATA_DIR}/user_data:/app/user_data" \
              -v "${STAGING_DATA_DIR}/chroma_db:/app/chroma_db" \
              "$BACKEND_IMAGE" \
              uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --workers 1

            echo "=== Waiting for staging backend readiness ==="
            if ! wait_for_backend_ready "Staging backend" "${STAGING_BACKEND_CONTAINER}" 60 5; then
              exit 1
            fi

            echo "=== Cleaning up staging candidate container ==="
            docker rm -f "${STAGING_CANDIDATE_CONTAINER}" 2>/dev/null || true
            rm -f "$BACKEND_IMAGE_ARCHIVE" 2>/dev/null || true

            echo "=== Pruning dangling images ==="
            docker image prune -f || true

      - name: Revoke temporary SSH ingress
        if: always()
        run: scripts/ci/revoke_ec2_ssh_ingress.sh

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Staging Deploy Summary"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Workflow trigger | \`${{ github.event_name }}\` |"
            echo "| Deploy ref | \`${{ steps.target.outputs.deploy_ref }}\` |"
            echo "| Commit | \`${{ steps.version.outputs.sha }}\` |"
            echo "| Release version | \`${{ steps.version.outputs.version }}\` |"
            echo "| Backend image | \`ghcr.io/${{ env.IMAGE_NAME }}-backend:${{ steps.version.outputs.version }}\` |"
            echo "| Backend image bundle | \`${{ steps.export_backend_image.outputs.archive_name }}\` |"
            echo "| Frontend image | \`ghcr.io/${{ env.IMAGE_NAME }}-frontend:${{ steps.version.outputs.version }}\` |"
            echo "| Backend image build | \`${{ steps.build_backend_image.outcome }}\` |"
            echo "| Backend smoke test | \`${{ steps.smoke_test_backend_image.outcome }}\` |"
            echo "| Backend bundle transfer | \`${{ steps.transfer_backend_image.outcome }}\` |"
            echo "| Frontend image build | \`${{ steps.build_frontend_image.outcome }}\` |"
            echo "| Backend staging deploy | \`${{ steps.deploy_backend.outcome }}\` |"
            echo "| Staging backend | \`smart-tutor-staging-backend\` on port 8110 of the production EC2 |"
            echo "| Frontend preview deploy | Vercel Git integration (PR preview) |"
            echo ""
            echo "Stages:"
            echo "- Backend image build and smoke test"
            echo "- Frontend image build"
            echo "- Vercel Git integration publishes the frontend preview for the branch"
            echo "- Staging backend replacement on the shared EC2 (isolated data dir, CPU/RAM capped)"
          } >> "$GITHUB_STEP_SUMMARY"

  teardown-staging:
    name: Tear Down Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
    # Free the shared production host when a staged PR is unlabelled or closed.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'unlabeled' && github.event.label.name == 'deploy:staging') ||
       (github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'deploy:staging')))
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || '' }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || '' }}
      EC2_HOST: ${{ secrets.EC2_HOST || '' }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID || vars.EC2_INSTANCE_ID || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Install AWS CLI
        if: ${{ env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' }}
        uses: unfor19/install-aws-cli-action@e8b481e524a99f37fbd39fdc1dcb3341ab091367  # v1.0.7

      - name: Resolve EC2 target (shared with production)
        id: ec2-target
        run: scripts/ci/resolve_ec2_target.sh

      - name: Stop staging containers
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ steps.ec2-target.outputs.host }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            docker rm -f smart-tutor-staging-backend smart-tutor-staging-backend-candidate 2>/dev/null || true
            rm -f /tmp/staging-backend-image-*.tar.gz 2>/dev/null || true
            docker image prune -f >/dev/null 2>&1 || true
            echo "Staging containers removed."

      - name: Revoke temporary SSH ingress
        if: always()
        run: scripts/ci/revoke_ec2_ssh_ingress.sh
