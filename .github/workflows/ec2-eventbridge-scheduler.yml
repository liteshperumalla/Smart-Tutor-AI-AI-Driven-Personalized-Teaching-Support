name: EC2 EventBridge Scheduler

# Creates/updates the AWS EventBridge Scheduler schedule that starts the
# production EC2 instance at 08:50 (Mon-Fri, America/Chicago). GitHub cron
# alone has missed the morning start; EventBridge fires on time.
# ec2-schedule.yml still does every stop, since it checks for running
# deploys first.
#
# Runs on manual dispatch and whenever this workflow or its script change.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ec2-eventbridge-scheduler.yml'
      - 'scripts/ci/setup_ec2_eventbridge_schedules.sh'

permissions:
  contents: read

concurrency:
  group: ec2-eventbridge-scheduler
  cancel-in-progress: false

jobs:
  apply:
    name: Apply EC2 start schedule
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Create or update the start schedule
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'us-east-1' }}
          INSTANCE_ID: i-0c35826b951e9dd6f
        run: scripts/ci/setup_ec2_eventbridge_schedules.sh
