---
# Rate limiting policy
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: rate-limit-policy
  namespace: production
spec:
  selector:
    matchLabels:
      app: backend
  action: CUSTOM
  provider:
    name: envoy-ext-authz-http
  rules:
    - to:
        - operation:
            paths: ["/api/v1/*"]

---
# Block specific paths (if needed)
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: deny-admin-paths
  namespace: production
spec:
  selector:
    matchLabels:
      app: backend
  action: DENY
  rules:
    - to:
        - operation:
            paths: ["/admin/*", "/debug/*"]
      when:
        - key: request.headers[x-admin-token]
          notValues: ["valid-admin-token"]
