apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: production
spec:
  # Enforce mTLS for all workloads in production namespace
  mtls:
    mode: STRICT

---
# Allow specific services to accept non-mTLS traffic (e.g., health checks from ALB)
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: backend-health-check
  namespace: production
spec:
  selector:
    matchLabels:
      app: backend
  mtls:
    mode: STRICT
  portLevelMtls:
    # Allow health check endpoint without mTLS
    8000:
      mode: PERMISSIVE

---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default-mesh-wide
  namespace: istio-system
spec:
  # Mesh-wide mTLS policy
  mtls:
    mode: STRICT
