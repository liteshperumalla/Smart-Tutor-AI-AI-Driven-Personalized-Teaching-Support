# Certificate for NGINX Ingress with cert-manager
# (Not needed if using AWS ALB with ACM)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: smart-ai-tutor-cert
  labels:
    app: smart-ai-tutor
spec:
  secretName: smart-ai-tutor-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - smart-ai-tutor.com
    - www.smart-ai-tutor.com
    - api.smart-ai-tutor.com

---
# ClusterIssuer for Let's Encrypt
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@smart-ai-tutor.com  # Replace with your email
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: nginx
