apiVersion: v1
kind: ConfigMap
metadata:
  name: ambassador-envoy-config
  labels:
    app: smart-ai-tutor
    component: ambassador
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 9901

    static_resources:
      listeners:
        # Ambassador Egress Listener for Bedrock / External LLM APIs
        - name: egress_llm_listener
          address:
            socket_address:
              address: 127.0.0.1
              port_value: 9001
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: egress_llm
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                    route_config:
                      name: llm_egress_route
                      virtual_hosts:
                        - name: bedrock_llm_service
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: "/"
                              route:
                                cluster: bedrock_cluster
                                timeout: 60s
                                retry_policy:
                                  retry_on: "5xx,gateway-error,reset,connect-failure"
                                  num_retries: 3
                                  per_try_timeout: 20s
                                  retry_back_off:
                                    base_interval: 0.2s
                                    max_interval: 1.5s
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

        # Ambassador Egress Listener for Vector Store / Neural Reranking
        - name: egress_vector_listener
          address:
            socket_address:
              address: 127.0.0.1
              port_value: 9002
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: egress_vector
                    route_config:
                      name: vector_egress_route
                      virtual_hosts:
                        - name: vector_service
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: "/"
                              route:
                                cluster: vector_cluster
                                timeout: 15s
                                retry_policy:
                                  retry_on: "5xx,connect-failure"
                                  num_retries: 2
                                  per_try_timeout: 5s
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
        - name: bedrock_cluster
          connect_timeout: 3s
          type: LOGICAL_DNS
          dns_lookup_family: V4_ONLY
          lb_policy: ROUND_ROBIN
          circuit_breakers:
            thresholds:
              - priority: DEFAULT
                max_connections: 1024
                max_pending_requests: 512
                max_requests: 2048
                max_retries: 5
          load_assignment:
            cluster_name: bedrock_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: bedrock-runtime.us-east-1.amazonaws.com
                          port_value: 443
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: bedrock-runtime.us-east-1.amazonaws.com

        - name: vector_cluster
          connect_timeout: 2s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          circuit_breakers:
            thresholds:
              - priority: DEFAULT
                max_connections: 512
                max_pending_requests: 256
          load_assignment:
            cluster_name: vector_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: redis.smart-ai-tutor.svc.cluster.local
                          port_value: 6379
