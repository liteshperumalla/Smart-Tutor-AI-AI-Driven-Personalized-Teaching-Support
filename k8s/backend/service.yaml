apiVersion: v1
kind: Service
metadata:
  name: backend-api
  labels:
    app: smart-ai-tutor
    component: backend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"  # For AWS NLB
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: ClusterIP  # Internal service (exposed via Ingress)
  sessionAffinity: None

  selector:
    app: smart-ai-tutor
    component: backend

  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP

  # Health check configuration
  publishNotReadyAddresses: false
