apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  labels:
    app: smart-ai-tutor
    component: backend
    tier: api
spec:
  replicas: 3  # High availability with 3 replicas
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero-downtime deployments
  selector:
    matchLabels:
      app: smart-ai-tutor
      component: backend
  template:
    metadata:
      labels:
        app: smart-ai-tutor
        component: backend
        tier: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # SECURITY: Run as non-root user
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      # Init container for database migration
      initContainers:
        - name: db-migration
          image: smart-ai-tutor-backend:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Checking database connection..."
              python -c "import psycopg2; conn = psycopg2.connect(host='$POSTGRES_HOST', port=$POSTGRES_PORT, dbname='$POSTGRES_DB', user='$POSTGRES_USER', password='$POSTGRES_PASSWORD'); conn.close(); print('Database connection successful')"
              echo "Running migrations..."
              # Add migration command here (e.g., alembic upgrade head)
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL

      containers:
        - name: backend-api
          image: smart-ai-tutor-backend:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          # PRODUCTION: Environment variables from ConfigMap and Secrets
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets

          # HEALTH CHECKS: Liveness, Readiness, and Startup Probes
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30  # 30 * 5 = 150 seconds to start

          # RESOURCES: Request and Limits
          resources:
            requests:
              cpu: 500m      # 0.5 CPU cores
              memory: 512Mi  # 512 MB
            limits:
              cpu: 2000m     # 2 CPU cores max
              memory: 2Gi    # 2 GB max

          # SECURITY: Container security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # App needs to write logs
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE

          # VOLUME MOUNTS: For logs and temporary files
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: temp
              mountPath: /tmp

      # VOLUMES: EmptyDir for logs and temp files
      volumes:
        - name: logs
          emptyDir: {}
        - name: temp
          emptyDir: {}

      # AFFINITY: Spread pods across nodes for HA
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: component
                      operator: In
                      values:
                        - backend
                topologyKey: kubernetes.io/hostname

      # TOLERATIONS: Allow scheduling on specific node types
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "api"
          effect: "NoSchedule"
