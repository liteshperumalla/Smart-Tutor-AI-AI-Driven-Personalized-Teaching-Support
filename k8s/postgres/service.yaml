apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  labels:
    app: smart-ai-tutor
    component: postgres
spec:
  type: ClusterIP
  selector:
    app: smart-ai-tutor
    component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP

---
# Headless service for StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  labels:
    app: smart-ai-tutor
    component: postgres
spec:
  clusterIP: None  # Headless service
  selector:
    app: smart-ai-tutor
    component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
