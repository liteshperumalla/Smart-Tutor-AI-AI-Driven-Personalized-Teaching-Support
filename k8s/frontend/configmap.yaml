apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  labels:
    app: smart-ai-tutor
    component: frontend
data:
  # API Configuration
  NEXT_PUBLIC_API_BASE_URL: "https://api.smart-ai-tutor.com"
  NEXT_PUBLIC_API_URL: "https://api.smart-ai-tutor.com/api/v1"

  # Google OAuth Configuration
  NEXT_PUBLIC_GOOGLE_CLIENT_ID: "REPLACE_WITH_GOOGLE_CLIENT_ID"
  NEXT_PUBLIC_GOOGLE_REDIRECT_URI: "https://smart-ai-tutor.com/auth/google/callback"

  # Application Configuration
  NEXT_PUBLIC_APP_NAME: "Smart AI Tutor"
  NEXT_PUBLIC_APP_VERSION: "1.0.0"

  # Feature Flags
  NEXT_PUBLIC_ENABLE_GOOGLE_AUTH: "true"
  NEXT_PUBLIC_ENABLE_ANALYTICS: "true"

  # Environment
  NEXT_PUBLIC_ENVIRONMENT: "production"
