apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: smart-ai-tutor
    component: frontend
    tier: web
spec:
  replicas: 3  # High availability
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero-downtime deployments
  selector:
    matchLabels:
      app: smart-ai-tutor
      component: frontend
  template:
    metadata:
      labels:
        app: smart-ai-tutor
        component: frontend
        tier: web
    spec:
      # SECURITY: Run as non-root user
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: frontend
          image: smart-ai-tutor-frontend:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          # Environment variables from ConfigMap
          envFrom:
            - configMapRef:
                name: frontend-config

          env:
            # Next.js specific environment variables
            - name: NODE_ENV
              value: "production"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"

          # HEALTH CHECKS
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30  # 30 * 5 = 150 seconds to start

          # RESOURCES
          resources:
            requests:
              cpu: 250m      # 0.25 CPU cores
              memory: 256Mi  # 256 MB
            limits:
              cpu: 1000m     # 1 CPU core max
              memory: 1Gi    # 1 GB max

          # SECURITY: Container security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE

          # VOLUME MOUNTS: For Next.js cache
          volumeMounts:
            - name: nextjs-cache
              mountPath: /app/.next/cache
            - name: temp
              mountPath: /tmp

      # VOLUMES
      volumes:
        - name: nextjs-cache
          emptyDir: {}
        - name: temp
          emptyDir: {}

      # AFFINITY: Spread pods across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: component
                      operator: In
                      values:
                        - frontend
                topologyKey: kubernetes.io/hostname
