apiVersion: v1
kind: Service
metadata:
  name: redis-service
  labels:
    app: smart-ai-tutor
    component: redis
spec:
  type: ClusterIP
  selector:
    app: smart-ai-tutor
    component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
    - name: metrics
      port: 9121
      targetPort: metrics
      protocol: TCP
